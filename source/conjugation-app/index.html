<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#ffffff; --ink:#1a1a1a; --gray:#8a8a8a; --gray-light:#e4e4e4;
  --accent:#c4432e; --ok:#4a7a5c; --warn:#b8860b;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh; display:flex; justify-content:center;
  padding:60px 20px 80px;
}
.col{ width:100%; max-width:440px; }

/* header */
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:1rem;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin:0;}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 36px;}
.title-with-info{display:flex;align-items:center;gap:8px;}
.info-icon{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--gray);border:1px solid var(--gray-light);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.icon-inline{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--gray);border:1px solid var(--gray-light);border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px;margin:0 1px;}
.info-icon:hover{color:var(--ink);border-color:var(--ink);}
.lang-switch-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.how-to-panel{font-family:'Inter';font-size:.85rem;line-height:1.6;color:var(--ink);background:#fafafa;border:1px solid var(--gray-light);border-radius:2px;padding:20px 22px;margin:0 0 24px;}
.how-to-panel h3{font-family:'IBM Plex Mono',monospace;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);margin:18px 0 8px;}
.how-to-panel h3:first-child{margin-top:0;}
.how-to-panel ul{margin:6px 0;padding-left:20px;}
.how-to-panel li{margin-bottom:6px;}
.how-to-panel p{margin:6px 0;}
.color-ok{color:var(--ok);}
.color-almost{color:var(--warn);}
.color-bad{color:var(--accent);}
.lang-switch-label{font-family:'Inter';font-size:.72rem;font-weight:600;color:var(--gray);cursor:pointer;}
.lang-switch-label.active{color:var(--ink);}
.footer-credit{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--gray);text-align:center;margin:32px 0 0;}
.footer-credit a{color:var(--gray);text-decoration:underline;}
.footer-credit a:hover{color:var(--ink);}

/* filters (collapsed by default) */
.top-divider{ border:none; border-top:1px solid var(--gray-light); margin:0 0 40px; }
details.filters{ margin-top:56px; border-top:1px solid var(--gray-light); border-bottom:1px solid var(--gray-light); }
details.filters summary{
  list-style:none; cursor:pointer; padding:12px 0;
  font-family:'IBM Plex Mono',monospace; font-size:.82rem; letter-spacing:.06em; text-transform:uppercase; color:var(--gray);
  display:flex; justify-content:space-between; align-items:center;
}
details.filters > summary::-webkit-details-marker{ display:none; }
details.filters > summary::marker{ content:''; display:none; }
details.filters > summary::after{ content:'+'; font-family:'Inter'; font-size:1rem; }
details.filters[open] > summary::after{ content:'–'; }
.filter-body{ padding:4px 0 24px; }
.f-group{ margin-bottom:20px; }
.f-label{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gray); display:block; margin-bottom:8px; }
.f-sub{ font-family:'Inter'; font-size:.68rem; font-weight:600; color:#b3a58f; margin:10px 0 4px; }
.sub-details{ margin:4px 0; }
.sub-details summary.f-sub{ cursor:pointer; list-style:none; list-style-type:none; display:flex; align-items:center; justify-content:flex-start; text-align:left; width:100%; gap:5px; user-select:none; color:#b3a58f; }
.sub-details summary.f-sub::-webkit-details-marker{ display:none; }
.sub-details summary.f-sub::marker{ content:''; display:none; font-size:0; }
.sub-details summary.f-sub::before{ content:'▸'; font-size:.6rem; color:#b3a58f; transition:transform .12s ease; }
.sub-details[open] summary.f-sub::before{ transform:rotate(90deg); }
.sub-details .opt-row{ margin-top:4px; }
.opt-row{ display:flex; flex-wrap:wrap; gap:6px; }
.opt{
  font-family:'Inter'; font-size:.78rem; padding:4px 10px; cursor:pointer; user-select:none;
  border:1px solid var(--gray-light); color:var(--gray); border-radius:2px;
}
.opt.active{ border-color:var(--ink); color:var(--ink); }
.select-all-icon{ display:none; margin-left:8px; color:var(--gray); cursor:pointer; font-size:1.35rem; line-height:1; }
.sub-details[open] .select-all-icon{ display:inline; }
.select-all-icon:hover{ color:var(--ink); }
.opt.struct.active{ border-color:var(--accent); color:var(--accent); }
.radio-inline{ display:flex; gap:16px; font-size:.8rem; }
.radio-inline label{ display:flex; align-items:center; gap:5px; cursor:pointer; color:var(--gray); }
.radio-inline input:checked + span{ color:var(--ink); font-weight:600; }
input#manualInput{ width:100%; font-family:'IBM Plex Mono',monospace; font-size:.8rem; padding:8px 0; border:none; border-bottom:1px solid var(--gray-light); outline:none; background:transparent; }
input#manualInput:focus{ border-color:var(--ink); }

.manual-status .ok{ color:var(--ok); } .manual-status .bad{ color:var(--accent); }

.switch-track::before{ content:''; position:absolute; width:14px; height:14px; left:2.5px; top:2.5px; background:#fff; border-radius:50%; transition:transform .15s ease; box-shadow:0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + .switch-track{ background:var(--ink); }
.switch input:checked + .switch-track::before{ transform:translateX(15px); }
.switch-label{ font-family:'Inter'; font-size:.82rem; color:#4a4130; cursor:pointer; }

/* question */
.tags{ display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }

.tag.accent{ color:var(--accent); }

.extra-form{ color:#c2c2c2; }

.options-row{ display:flex; flex-direction:column; gap:0; margin:0 0 34px; }
.opt-btn{
  font-family:'IBM Plex Mono',monospace; font-size:1rem; text-align:left; padding:13px 4px;
  border:none; border-bottom:1px solid var(--gray-light); background:transparent; color:var(--ink); cursor:pointer;
  display:flex; align-items:center; gap:12px; width:100%;
}
.opt-btn:hover{ background:#fafafa; }
.opt-btn.correct{ color:var(--ok); font-weight:600; }
.opt-btn.wrong{ color:var(--accent); text-decoration:line-through; }
.opt-num{ font-size:.72rem; color:var(--gray); border:1px solid var(--gray-light); border-radius:3px; width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.opt-btn.correct .opt-num{ border-color:var(--ok); color:var(--ok); }
.opt-btn.wrong .opt-num{ border-color:var(--accent); color:var(--accent); }

.answer-wrap{ position:relative; margin-bottom:8px; }
.tilde-pop{
  position:absolute; top:-22px; left:0; font-family:'IBM Plex Serif',serif; font-size:1.3rem; color:var(--ok);
  opacity:0; transform:translateY(6px); transition:all .35s ease;
}
.tilde-pop.show{ opacity:1; transform:translateY(0); }
input#answer{
  width:100%; font-family:'IBM Plex Mono',monospace; font-size:1.3rem; padding:8px 0;
  border:none; border-bottom:2px solid var(--ink); outline:none; background:transparent; color:var(--ink);
}
input#answer.wrong{ border-color:var(--accent); color:var(--accent); }
input#answer.correct{ border-color:var(--ok); color:var(--ok); }

.actions{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
button{ font-family:'Inter'; font-weight:600; font-size:.85rem; border:none; cursor:pointer; background:none; padding:0; }
#checkBtn{ color:var(--bg); background:var(--ink); padding:10px 22px; border-radius:2px; transition:background .12s ease; }
#checkBtn:hover{ background:#333333; }
#checkBtn.btn-ok{ background:var(--ok); }
#checkBtn.btn-almost{ background:var(--warn); }
#checkBtn.btn-bad{ background:var(--accent); }

.feedback.almost{ color:var(--warn); }
.feedback.ok{ color:var(--ok); }
.warn{ font-family:'Inter'; font-size:.85rem; color:var(--accent); border:1px solid var(--accent); padding:12px 14px; border-radius:2px; }

/* streak as accumulating tildes */

<script>
/* ================= engine ================= */
const ACCENT = {a:'á',e:'é',i:'í',o:'ó',u:'ú'};
const DEACCENT = {á:'a',é:'e',í:'i',ó:'o',ú:'u'};
function stripAccents(s){ return s.replace(/[áéíóú]/g, c=>DEACCENT[c]); }
function accentLast(s){ const c=s.slice(-1); return s.slice(0,-1) + (ACCENT[c]||c); }
function imperfSubj(verb){ const raw = verb.pronominal ? verb.table.preterito[4].replace(/^(me |te |se |nos )/,'') : verb.table.preterito[4]; const base=raw.slice(0,-3); return [base+'ra',base+'ras',base+'ra',accentLast(base)+'ramos',base+'ran']; }

/* ===== vosotros (España) — derived from existing table data via regular formulas.
   Vosotros is almost never irregular: the only true exceptions are ser->sois and ir->vais
   in the present tense. Everything else (even for irregular verbs like tener, decir, ir)
   follows a predictable pattern from the verb's own forms, which is why we derive it
   instead of hand-writing a whole extra column for 290 verbs. */
function bare(verb, form){
  if(!verb.pronominal) return form;
  return form.replace(/^(me |te |se |nos )/,'');
}
const VOSOTROS_PRES_EXC = {ser:'sois', ir:'vais', dar:'dais', ver:'veis'};
function vosotrosSimple(verb, tense){
  const inf = verb.pronominal ? verb.baseInf : verb.inf;
  if(tense==='presente'){
    let form;
    if(VOSOTROS_PRES_EXC[inf]) form = VOSOTROS_PRES_EXC[inf];
    else { const type=inf.slice(-2), stem=inf.slice(0,-2); form = stem + (type==='ar'?'áis':(type==='er'?'éis':'ís')); }
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='preterito'){
    const tu = bare(verb, verb.table.preterito[1]);
    const suffix = tu.slice(-4); // 'aste' or 'iste' — read from the actual form, not the infinitive class,
    const stem = tu.slice(0,-4); // since irregular preterites (estar, dar, andar...) use -iste even for -ar verbs
    const form = stem + (suffix==='aste' ? 'asteis' : 'isteis');
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='imperfecto'){
    const yo = bare(verb, verb.table.imperfecto[0]);
    const form = yo.slice(0,-1) + 'ais'; // strip last 'a' (aba/ía both end in 'a')
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='futuro'){
    const yo = bare(verb, verb.table.futuro[0]);
    const form = yo.slice(0,-1) + 'éis'; // strip 'é'
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='condicional'){
    const yo = bare(verb, verb.table.condicional[0]);
    const form = yo.slice(0,-2) + 'íais'; // strip 'ía'
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='subjuntivo'){
    const nos = bare(verb, verb.table.subjuntivo[3]); // nosotros — shares whichever irregularity (or lack of it) vosotros needs
    const suffix = nos.slice(-4); // 'emos' or 'amos'
    const stem = nos.slice(0,-4);
    const form = stem + (suffix==='emos' ? 'éis' : 'áis');
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='subjImperfecto'){
    const forms = imperfSubj(verb); // already bare
    const form = forms[4].slice(0,-1) + 'is'; // ellos-form 'hablaran' minus 'n' + 'is'
    return verb.pronominal ? 'os '+form : form;
  }
  return null;
}
function vosotrosCompound(verb, auxTense){
  const part = participio(verb);
  const auxForm = vosotrosSimple(HABER, auxTense==='subjImperfecto' ? 'subjImperfecto' : auxTense);
  return verb.pronominal ? ('os '+auxForm+' '+part) : (auxForm+' '+part);
}
const COMPOUND_AUX_TENSE = {
  pretPerfComp:'presente', pluscuamperfecto:'imperfecto', futuroComp:'futuro',
  condicionalComp:'condicional', subjPretPerfComp:'subjuntivo', subjPluscuamperfecto:'subjImperfecto',
};
function vosotrosForm(verb, tense){
  if(COMPOUND_AUX_TENSE[tense]) return vosotrosCompound(verb, COMPOUND_AUX_TENSE[tense]);
  return vosotrosSimple(verb, tense);
}
/* vosotros imperativo: regular for every verb, no exceptions — infinitive minus 'r', plus 'd'.
   Reflexive: drop the 'd' before 'os' (levantaos, not levantados) — except irse -> idos. */
const VOSOTROS_IMP_IRSE = 'idos';
function vosotrosImperativoAfirm(verb){
  const inf = verb.pronominal ? verb.baseInf : verb.inf;
  if(verb.pronominal && inf==='ir') return VOSOTROS_IMP_IRSE;
  const base = inf.slice(0,-1); // drop just the 'r' -> e.g. 'hablad' base 'habla'+'d'
  if(!verb.pronominal) return base + 'd';
  // reflexive: drop the 'd', add accent for -ir verbs (vestíos), then 'os'
  const type = inf.slice(-2);
  const reflexiveBase = type==='ir' ? accentLast(base) : base;
  return reflexiveBase + 'os';
}
function vosotrosImperativoNeg(verb){
  const form = vosotrosSimple(verb, 'subjuntivo');
  return 'no ' + form;
}

const IRREG_PART = {hacer:'hecho', ver:'visto', poner:'puesto', volver:'vuelto', escribir:'escrito',
  romper:'roto', morir:'muerto', decir:'dicho', abrir:'abierto', cubrir:'cubierto', descubrir:'descubierto',
  proponer:'propuesto', detener:'detenido', sostener:'sostenido', suponer:'supuesto', obtener:'obtenido', mantener:'mantenido'};
function participio(verb){
  const inf = verb.pronominal ? verb.baseInf : verb.inf;
  if(IRREG_PART[inf]) return IRREG_PART[inf];
  const stem = inf.slice(0,-2);
  const type = inf.slice(-2);
  return stem + (type==='ar' ? 'ado' : 'ido');

const VOS_PRES_EXC = {ser:'sos', ir:'vas', haber:'has'};
const VOS_IMP_EXC = {ir:'andá', ser:'sé'};
function vosPresente(v){
  const inf = v.pronominal ? v.baseInf : v.inf;
  let form;
  if(VOS_PRES_EXC[inf]) form = VOS_PRES_EXC[inf];
  else {
    const type = inf.slice(-2), stem = inf.slice(0,-2);
    const end = type==='ar' ? 'ás' : (type==='er' ? 'és' : 'ís');
    form = stem + end;
  }
  return v.pronominal ? ('te '+form) : form;
}
function vosImperativoAfirm(v){
  const inf = v.pronominal ? v.baseInf : v.inf;
  let base;
  if(VOS_IMP_EXC[inf]) base = VOS_IMP_EXC[inf];
  else {
    const type = inf.slice(-2), stem = inf.slice(0,-2);
    const vowel = type==='ar' ? 'á' : (type==='er' ? 'é' : 'í');
    base = stem + vowel;
  }
  return v.pronominal ? (stripAccents(base)+'te') : base;

/* affirmative commands attach reflexive pronouns as a suffix (levántate, not te levanta),
   with a written accent to keep the original stress: accent the second-to-last vowel of the
   word before attaching tú/usted/ustedes pronouns; nosotros drops the -mos and accents that vowel. */
function vowelGroups(word){
  const isVowel=c=>'aeiou'.includes(c);
  const chars=word.split(''); const excluded=new Set();
  for(let i=0;i<chars.length;i++){
    if(chars[i]==='u'){
      if(chars[i-1]==='q') excluded.add(i);
      else if(chars[i-1]==='g' && (chars[i+1]==='e'||chars[i+1]==='i')) excluded.add(i);
    }
  }
  const groups=[]; let cur=[];
  for(let i=0;i<chars.length;i++){
    if(isVowel(chars[i]) && !excluded.has(i)) cur.push(i);
    else { if(cur.length){ groups.push(cur); cur=[]; } }
  }
  if(cur.length) groups.push(cur);
  return groups;
}
function accentPenultimateVowel(word){
  if(/[áéíóú]/.test(word)) return word; // already carries its correct written accent (e.g. gradúa)
  const groups=vowelGroups(word);
  if(groups.length<2) return word;
  const target=groups[groups.length-2];
  const strong='aeo';
  let idx=target.find(i=>strong.includes(word[i]));
  if(idx===undefined) idx=target[target.length-1];
  return word.slice(0,idx)+ACCENT[word[idx]]+word.slice(idx+1);
}
function imperativoAfirmativoReflexivo(v,p){
  if(p===0){
    let base;
    if(TU_IMPERATIVO_IRREGULAR[v.baseInf]) base=TU_IMPERATIVO_IRREGULAR[v.baseInf];
    else { const bare=v.table.presente[1].replace(/^te /,''); base=bare.endsWith('s')?bare.slice(0,-1):bare; }
    return accentPenultimateVowel(base)+'te';
  }
  if(p===1){ const bare=v.table.subjuntivo[2].replace(/^se /,''); return accentPenultimateVowel(bare)+'se'; }
  if(p===2){ const bareFull=v.table.subjuntivo[3].replace(/^nos /,''); const stem=bareFull.slice(0,-3); return accentLast(stem)+'monos'; }
  if(p===3){ const bare=v.table.subjuntivo[4].replace(/^se /,''); return accentPenultimateVowel(bare)+'se'; }
}

/* ===== gerundio (for "estar + gerundio") =====
   Derived mostly from the preterito (él/ella) form we already have verified, since -ir stem-changing
   verbs (pedir->pidiendo, dormir->durmiendo) and y-insertion verbs (leer->leyendo, construir->construyendo)
   already show that exact pattern there. -ar verbs are always regular (-ando) and never use this rule,
   since an -ar preterito can coincidentally end in "ió" (anunció) without that meaning anything for the gerund.
   A handful of verbs are irregular in a way neither rule catches, so they're hand-specified. */
const GERUNDIO_HAND = {ir:'yendo', poder:'pudiendo', decir:'diciendo', traer:'trayendo', venir:'viniendo', reír:'riendo'};
function gerundio(verb){
  const inf = verb.pronominal ? verb.baseInf : verb.inf;
  if(GERUNDIO_HAND[inf]) return GERUNDIO_HAND[inf];
  if(verb.type==='ar'){ return inf.slice(0,-2)+'ando'; }
  const pret2 = verb.pronominal ? verb.table.preterito[2].replace(/^(me |te |se |nos )/,'') : verb.table.preterito[2];
  if(pret2.endsWith('yó')) return pret2.slice(0,-2)+'yendo';
  if(pret2.endsWith('ió')) return pret2.slice(0,-2)+'iendo';
  const stem = inf.slice(0,-2);
  return (stem && 'aeiou'.includes(stem.slice(-1))) ? stem+'yendo' : stem+'iendo';
}
/* attaching a pronoun to the gerundio always needs a written accent on its stressed vowel
   (the one right after and-/iend-/yend-), since the extra syllable pushes it off the default
   stress position — same principle as attaching pronouns to tú-imperatives. */
function accentGerundioForAttach(ger){
  if(ger.endsWith('ando')) return ger.slice(0,-4)+'ándo';
  if(ger.endsWith('iendo')) return ger.slice(0,-5)+'iéndo';
  if(ger.endsWith('yendo')) return ger.slice(0,-5)+'yéndo';
  return ger;
}

const EXAMPLE_VERBS = ['hablar','comer','vivir'];
function exampleForms(tenseId, person, neg){
  return EXAMPLE_VERBS.map(inf=>{
    const v = VERBS.find(vv=>vv.inf===inf);
    const q = {tense:tenseId, verb:v, person};
    if(neg!==undefined) q.neg = neg;
    return computeAnswer(q);
  }).join(' · ');
}
/* builds the tú line(s): if vos would produce the exact same forms (true for every tense
   except presente indicativo and imperativo afirmativo), fold it into one line with just
   "vos" shown in light gray; otherwise vos gets its own full light line underneath. */
function tuVosLines(tuForms, vosForms){
  if(tuForms===vosForms){
    return tuForms+' (tú, <span class="extra-form">vos</span>)';
  }
  return tuForms+' (tú)<br><span class="extra-form">'+vosForms+' (vos)</span>';
}
function vosotrosLine(vosotrosForms){
  return '<span class="extra-form">'+vosotrosForms+' (vosotros)</span>';
}
function tenseExample(tenseId){
  if(tenseId==='impTuAfirm'){
    const tuForms = exampleForms('impTuAfirm', 0);
    const vosForms = EXAMPLE_VERBS.map(inf=>vosImperativoAfirm(VERBS.find(v=>v.inf===inf))).join(' · ');
    return tuVosLines(tuForms, vosForms);
  }
  if(tenseId==='impOtras'){
    const tuNegForms = exampleForms('impOtras', 0, true); // voseo has no distinct negative; always same as tú
    const afirm = [
      exampleForms('impOtras', 1, false)+' (él, ella, usted)',
      exampleForms('impOtras', 2, false)+' (nosotros)',
      vosotrosLine(EXAMPLE_VERBS.map(inf=>vosotrosImperativoAfirm(VERBS.find(v=>v.inf===inf))).join(' · ')),
      exampleForms('impOtras', 3, false)+' (ustedes, ellos, ellas)',
    ];
    const neg = [
      tuVosLines(tuNegForms, tuNegForms),
      exampleForms('impOtras', 1, true)+' (él, ella, usted)',
      exampleForms('impOtras', 2, true)+' (nosotros)',
      vosotrosLine(EXAMPLE_VERBS.map(inf=>vosotrosImperativoNeg(VERBS.find(v=>v.inf===inf))).join(' · ')),
      exampleForms('impOtras', 3, true)+' (ustedes, ellos, ellas)',
    ];
    return '<u>'+tr('afirmativo')+'</u><br>'+afirm.join('<br>')+'<br><br><u>'+tr('negativo')+'</u><br>'+neg.join('<br>');
  }
  const lines = [];
  lines.push(exampleForms(tenseId, 0)+' (yo)');
  const tuForms = exampleForms(tenseId, 1);
  const vosForms = tenseId==='presente'
    ? EXAMPLE_VERBS.map(inf=>vosPresente(VERBS.find(v=>v.inf===inf))).join(' · ')
    : tuForms; // every other tense: vos = tú, no distinct form
  lines.push(tuVosLines(tuForms, vosForms));
  lines.push(exampleForms(tenseId, 2)+' (él, ella, usted)');
  lines.push(exampleForms(tenseId, 3)+' (nosotros)');
  lines.push(vosotrosLine(EXAMPLE_VERBS.map(inf=>vosotrosForm(VERBS.find(v=>v.inf===inf), tenseId)).join(' · ')));
  lines.push(exampleForms(tenseId, 4)+' (ustedes, ellos, ellas)');
  return lines.join('<br>');
}

const SELECT_ALL_ICON_ID = { tenseChipsInd:'selAllInd', tenseChipsSubj:'selAllSubj', tenseChipsImp:'selAllImp' };
function buildTenseChipGroup(containerId, options){
  const el=document.getElementById(containerId);
  el.innerHTML='';
  const iconId = SELECT_ALL_ICON_ID[containerId];
  if(iconId){
    const icon = document.getElementById(iconId);
    icon.title = tr('selectAll');
    icon.onclick = (e)=>{
      e.preventDefault(); e.stopPropagation();
      const allSelected = options.every(v=>tensesActivos.has(v));
      if(allSelected){
        const remainingOutside = Array.from(tensesActivos).filter(v=>!options.includes(v));
        if(remainingOutside.length===0){
          tensesActivos = new Set(['presente']); // nothing would be left selected — fall back to the default
        } else {
          options.forEach(v=>tensesActivos.delete(v));
        }
      } else {
        options.forEach(v=>tensesActivos.add(v));
      }
      buildTenseChipGroup('tenseChipsInd', TENSE_GROUPS.ind);
      buildTenseChipGroup('tenseChipsSubj', TENSE_GROUPS.subj);
      buildTenseChipGroup('tenseChipsImp', TENSE_GROUPS.imp);
      refresh();
    };
  }
  options.forEach(val=>{
    const wrap=document.createElement('div');
    wrap.style.display='flex'; wrap.style.alignItems='center'; wrap.style.gap='2px';

    const chip=document.createElement('div');
    chip.className='opt'+(tensesActivos.has(val)?' active':'');
    if(val==='impTuAfirm'){
      const label = lang==='es' ? 'imperativo puro' : 'pure imperative';
      const afirm = lang==='es' ? 'afirmativo' : 'affirmative';
      chip.innerHTML = label+' (tú, <span class="extra-form">vos</span>, <span class="extra-form">vosotros</span> '+afirm+')';
    } else {
      chip.textContent=TN(val);
    }
    chip.addEventListener('click',()=>{
      if(tensesActivos.has(val)){
        if(tensesActivos.size===1) return;
        tensesActivos.delete(val); chip.classList.remove('active');
      } else { tensesActivos.add(val); chip.classList.add('active'); }
      refresh();
    });

    const info=document.createElement('span');
    info.textContent='i';
    info.style.cssText='font-family:IBM Plex Mono,monospace;font-size:.62rem;color:var(--gray);border:1px solid var(--gray-light);border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;';
    const pop=document.createElement('div');
    pop.style.cssText='display:none;font-family:IBM Plex Mono,monospace;font-size:.68rem;line-height:1.8;color:var(--ink);background:#fafafa;border:1px solid var(--gray-light);padding:8px 9px;border-radius:2px;margin:2px 0 6px;width:100%;';
    pop.innerHTML = tenseExample(val);
    info.addEventListener('click',(e)=>{
      e.stopPropagation();
      const willOpen = pop.style.display==='none';
      if(openInfoPop && openInfoPop!==pop) openInfoPop.style.display='none';
      pop.style.display = willOpen ? 'block' : 'none';
      openInfoPop = willOpen ? pop : null;
    });

    wrap.appendChild(chip); wrap.appendChild(info);
    const outer=document.createElement('div'); outer.style.cssText='display:flex;flex-direction:column;';
    outer.appendChild(wrap); outer.appendChild(pop);
    el.appendChild(outer);
  });
}

function structExample(id){
  if(id==='perifrastico'){
    const perif=(p)=>EXAMPLE_VERBS.map(inf=>{
      const v=VERBS.find(vv=>vv.inf===inf);
      return computeAnswer({tense:'perifrastico', auxTense:'presente', verb:v, person:p});
    }).join(' · ');
    const lines=[];
    lines.push(perif(0)+' (yo)');
    const tuForms=perif(1);
    const vosForms=EXAMPLE_VERBS.map(inf=>vosPresente(IR_OBJ)+' a '+inf).join(' · ');
    lines.push(tuVosLines(tuForms, vosForms));
    lines.push(perif(2)+' (él, ella, usted)');
    lines.push(perif(3)+' (nosotros)');
    const vosotrosForms=EXAMPLE_VERBS.map(inf=>vosotrosForm(IR_OBJ,'presente')+' a '+inf).join(' · ');
    lines.push(vosotrosLine(vosotrosForms));
    lines.push(perif(4)+' (ustedes, ellos, ellas)');
    return lines.join('<br>');
  }
  if(id==='gustarE'){
    const lines=[];
    lines.push(GUSTAR_OBJ[0]+' gusta (yo)');
    lines.push(tuVosLines(GUSTAR_OBJ[1]+' gusta', GUSTAR_OBJ[1]+' gusta'));
    lines.push(GUSTAR_OBJ[2]+' gusta (él, ella, usted)');
    lines.push(GUSTAR_OBJ[3]+' gusta (nosotros)');
    lines.push(vosotrosLine(GUSTAR_OBJ[5]+' gusta'));
    lines.push(GUSTAR_OBJ[4]+' gusta (ustedes, ellos, ellas)');
    return lines.join('<br>');
  }
  if(id==='gerundio'){
    const ger=(p)=>EXAMPLE_VERBS.map(inf=>{
      const v=VERBS.find(vv=>vv.inf===inf);
      return computeAnswer({tense:'gerundio', auxTense:'presente', verb:v, person:p});
    }).join(' · ');
    const lines=[];
    lines.push(ger(0)+' (yo)');
    const tuForms=ger(1);
    const vosForms=EXAMPLE_VERBS.map(inf=>vosPresente(ESTAR_OBJ)+' '+gerundio(VERBS.find(vv=>vv.inf===inf))).join(' · ');
    lines.push(tuVosLines(tuForms, vosForms));
    lines.push(ger(2)+' (él, ella, usted)');
    lines.push(ger(3)+' (nosotros)');
    const vosotrosForms=EXAMPLE_VERBS.map(inf=>vosotrosForm(ESTAR_OBJ,'presente')+' '+gerundio(VERBS.find(vv=>vv.inf===inf))).join(' · ');
    lines.push(vosotrosLine(vosotrosForms));
    lines.push(ger(4)+' (ustedes, ellos, ellas)');
    return lines.join('<br>');
  }
  return '';
}

document.getElementById('manualInput').addEventListener('input', e=>{
  const raw=e.target.value.trim(); const status=document.getElementById('manualStatus');
  if(!raw){ manualVerbs=[]; onlyManual=false; status.innerHTML=''; renderOnlyManualChip(); refresh(); return; }
  const names=raw.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);

function refresh(){ questionQueue=[]; historyStack=[]; historyIndex=-1; renderQuestion(nextQuestion()); }

function pool(){
  let b=VERBS.filter(v=>v.nivel<=nivelMax && tiposActivos.has(v.tag) && !v.esTipoGustar && (pronominalIncluido || !v.pronominal));
  if(onlyEspeciales && pronominalIncluido){ b = b.filter(v=>v.pronominal); }
  if(manualVerbs.length){
    const manualNonGustar = manualVerbs.filter(v=>!v.esTipoGustar);
    if(onlyManual) return manualNonGustar;
    b = Array.from(new Set([...manualNonGustar, ...b]));
  }
  return b;
}
function gustarPool(){
  let b=VERBS.filter(v=>v.esTipoGustar && v.nivel<=nivelMax && tiposActivos.has(v.tag));
  if(manualVerbs.length){
    const m=manualVerbs.filter(v=>v.esTipoGustar);
    if(onlyManual) return m; // may be empty; caller falls back gracefully
    if(m.length) b = Array.from(new Set([...m, ...b]));
  }
  return b;
}

function activeQuestionTypes(){
  if(onlyEspeciales && structsActivos.size>0){
    const list=[]; structsActivos.forEach(s=>list.push({kind:'struct',id:s})); return list;
  }
  const list=[]; tensesActivos.forEach(t=>list.push({kind:'tense',id:t})); structsActivos.forEach(s=>list.push({kind:'struct',id:s})); return list;
}
const AUX_TENSE_POOL_PERIFRASTICO = ['presente','imperfecto']; // "voy a" / "iba a" only

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
/* build every possible verb+tense+person combo for the current filters, shuffled;
   consumed one at a time so nothing repeats until the whole set has been used */
const MANUAL_PRIVILEGE_WEIGHT = 3;
function buildQueue(){
  const types=activeQuestionTypes();
  const combos=[];
  const privileged = (manualVerbs.length && !onlyManual) ? new Set(manualVerbs) : null;
  const nPersonsNow = variedad==='espana' ? 6 : 5;
  types.forEach(qt=>{
    if(qt.kind==='struct'){
      let verbSource = qt.id==='gustarE' ? gustarPool() : pool();
      const auxPool = qt.id==='perifrastico'
        ? AUX_TENSE_POOL_PERIFRASTICO.filter(t=>tensesActivos.has(t))
        : Array.from(tensesActivos).filter(t=>t!=='impTuAfirm' && t!=='impOtras'); // follow "Tiempos verbales" (imperativo doesn't apply here)
      verbSource.forEach(verb=>{
        const copies = (privileged && privileged.has(verb)) ? MANUAL_PRIVILEGE_WEIGHT : 1;
        auxPool.forEach(auxTense=>{
          for(let person=0; person<nPersonsNow; person++){
            for(let c=0;c<copies;c++) combos.push({tense:qt.id, auxTense, verb, person});
          }
        });
      });
    } else if(qt.id==='impTuAfirm'){
      const verbSource = pool();
      verbSource.forEach(verb=>{
        const copies = (privileged && privileged.has(verb)) ? MANUAL_PRIVILEGE_WEIGHT : 1;
        for(let c=0;c<copies;c++) combos.push({tense:qt.id, verb, person:0});
      });
    } else if(qt.id==='impOtras'){
      const verbSource = pool();
      const combosList = variedad==='espana' ? IMP_OTRAS_COMBOS.concat([{person:5,neg:false},{person:5,neg:true}]) : IMP_OTRAS_COMBOS;
      verbSource.forEach(verb=>{
        const copies = (privileged && privileged.has(verb)) ? MANUAL_PRIVILEGE_WEIGHT : 1;
        combosList.forEach(combo=>{
          for(let c=0;c<copies;c++) combos.push({tense:qt.id, verb, person:combo.person, neg:combo.neg});
        });
      });
    } else {
      const verbSource = pool();
      verbSource.forEach(verb=>{
        const copies = (privileged && privileged.has(verb)) ? MANUAL_PRIVILEGE_WEIGHT : 1;
        for(let person=0; person<nPersonsNow; person++){
          for(let c=0;c<copies;c++) combos.push({tense:qt.id, verb, person});
        }
      });
    }
  });
  return shuffle(combos);
}
function nextQuestion(){
  const modes=Array.from(modosActivos);
  if(modes.length===0){ current=null; return null; }
  if(historyIndex < historyStack.length-1){
    historyIndex++;
    current = historyStack[historyIndex];
    return current;
  }
  if(questionQueue.length===0) questionQueue=buildQueue();
  if(questionQueue.length===0){ current=null; return null; }
  const combo=questionQueue.shift();
  const mode=modes[Math.floor(Math.random()*modes.length)];
  const q={mode, tense:combo.tense, auxTense:combo.auxTense, verb:combo.verb, person:combo.person, neg:combo.neg};
  historyStack.push(q); historyIndex=historyStack.length-1;
  current=q; return q;
}
function previousQuestion(){
  if(historyIndex<=0) return current; // already at the first question, stay put
  historyIndex--;
  current = historyStack[historyIndex];
  return current;
}
function compoundForm(verb,auxArr,p){ const part=participio(verb); if(verb.pronominal){ const pron=['me ','te ','se ','nos ','se ']; return pron[p]+auxArr[p]+' '+part; } return auxArr[p]+' '+part; }
function computeAnswer(q){
  const v=q.verb,p=q.person,t=q.tense;
  if(p===5 && variedad==='espana'){
    const vf = vosotrosForm(v, t);
    if(vf!==null) return vf;
  }
  if(t==='perifrastico'){
    const irForm = computeAnswer({tense:q.auxTense, verb:IR_OBJ, person:p});
    if(v.pronominal){
      const pron = ['me','te','se','nos','se','os'][p];
      return irForm+' a '+v.baseInf+pron; // "voy a quedarme"
    }
    return irForm+' a '+v.inf;
  }
  if(t==='gerundio'){
    const estarForm = computeAnswer({tense:q.auxTense, verb:ESTAR_OBJ, person:p});
    if(v.pronominal){
      const pron = ['me','te','se','nos','se','os'][p];
      return estarForm+' '+accentGerundioForAttach(gerundio(v))+pron; // "estoy quedándome"
    }
    return estarForm+' '+gerundio(v);
  }
  if(t==='gustarE') return GUSTAR_OBJ[p]+' '+computeAnswer({tense:q.auxTense, verb:v, person:2});
  if(t==='impTuAfirm'){
    if(variedad==='rioplatense') return vosImperativoAfirm(v);
    if(v.pronominal) return imperativoAfirmativoReflexivo(v,0);
    return tuImperativo(v);
  }
  if(t==='impOtras'){
    const s=v.table.subjuntivo;
    if(p===5){ // vosotros (España)
      return q.neg ? vosotrosImperativoNeg(v) : vosotrosImperativoAfirm(v);
    }
    if(q.neg){
      const map=[s[1],s[2],s[3],s[4]]; // tú,usted,nosotros,ustedes negative forms
      return 'no '+map[p];
    }
    if(v.pronominal) return imperativoAfirmativoReflexivo(v,p);
    return [null,s[2],s[3],s[4]][p]; // usted/nosotros/ustedes affirmative (tú never affirmative here)
  }
  if(t==='pretPerfComp') return compoundForm(v,HABER.table.presente,p);
  if(t==='pluscuamperfecto') return compoundForm(v,HABER.table.imperfecto,p);
  if(t==='futuroComp') return compoundForm(v,HABER.table.futuro,p);
  if(t==='condicionalComp') return compoundForm(v,HABER.table.condicional,p);
  if(t==='subjPretPerfComp') return compoundForm(v,HABER.table.subjuntivo,p);
  if(t==='subjPluscuamperfecto') return compoundForm(v,imperfSubj(HABER),p);
  if(t==='subjImperfecto'){
    const forms = imperfSubj(v);
    if(v.pronominal){ const pron=['me ','te ','se ','nos ','se ']; return pron[p]+forms[p]; }
    return forms[p];
  }
  if(t==='presente' && p===1 && variedad==='rioplatense') return vosPresente(v);
  return v.table[t][p];
}

async function renderQuestion(q){
  answered=false;
  lastCheckedValue = null;
  document.getElementById('prevBtn').disabled = historyIndex<=0;
  document.getElementById('warnBox').innerHTML='';
  document.getElementById('answer').value=''; document.getElementById('answer').className='';
  document.getElementById('feedback').textContent=''; document.getElementById('feedback').className='feedback';
  document.getElementById('mcBox').style.display='none'; document.getElementById('mcBox').innerHTML='';
  document.getElementById('inputWrap').style.display='block';
  document.getElementById('checkBtn').style.display='inline-block';
  document.getElementById('checkBtn').classList.remove('btn-ok','btn-almost','btn-bad');
  document.getElementById('tildePop').classList.remove('show');
  document.getElementById('verbDisplay').style.display='none';

  if(!q){
    document.getElementById('warnBox').innerHTML='<div class="warn">'+tr('noVerbs')+'</div>';
    document.getElementById('pronounLine').textContent='';
    document.getElementById('tags').innerHTML='';
    return;
  }

  const needsLongDisplay = q.tense==='perifrastico' || q.tense==='gerundio';
  const IMP_OTRAS_PERSON_LABEL = ['tú','usted','nosotros','ustedes',null,'vosotros'];
  const tagWrap=document.getElementById('tags'); tagWrap.innerHTML='';
  const t1=document.createElement('span'); t1.className='tag';
  const PERIFRASTICO_LABEL = { presente:tr('expresarFuturo'), imperfecto:tr('expresarFuturoPasado') };
  if(q.tense==='impOtras'){
    t1.textContent = tr('imperativeLabel')+': '+IMP_OTRAS_PERSON_LABEL[q.person] + ', ' + (q.neg?tr('negativo'):tr('afirmativo'));
  } else if(q.tense==='perifrastico'){
    t1.textContent = PERIFRASTICO_LABEL[q.auxTense] || TN(q.auxTense);
  } else {
    t1.textContent = TN(q.tense) || (structLabel(q.tense) + ' · ' + TN(q.auxTense));
  }
  tagWrap.appendChild(t1);
  const t2=document.createElement('span'); t2.className='tag accent';
  const typeSourceVerb = q.tense==='perifrastico' ? IR_OBJ : (q.tense==='gerundio' ? ESTAR_OBJ : q.verb);
  t2.textContent = typeSourceVerb.tag==='regular' ? 'regular' : 'irregular';
  tagWrap.appendChild(t2);

  const pronounLine=document.getElementById('pronounLine'); const verbDisplay=document.getElementById('verbDisplay');
  const isGustar=q.tense==='gustarE'; const isImp=q.tense==='impTuAfirm'||q.tense==='impOtras';
  const pronounList = isGustar ? (variedad==='rioplatense' ? ['a mí','a vos','a él / ella / usted','a nosotros/as','a ellos / ellas / ustedes','a vosotros/as'] : GUSTAR_PRONOUNS)
                     : (isImp ? [(variedad==='rioplatense'?'vos':'tú'),'usted','nosotros','ustedes',null,'vosotros / vosotras']
                     : (variedad==='rioplatense' ? ['yo','vos','él / ella / usted','nosotros / nosotras','ellos / ellas / ustedes','vosotros / vosotras'] : PRONOUNS));
  const useMC = q.mode==='multiple';

  pronounLine.style.display='block';
  pronounLine.textContent = pronounList[q.person];
  verbDisplay.style.display='block';
  verbDisplay.classList.toggle('long', needsLongDisplay);
  let vPrefix = '';
  if(q.tense==='impOtras') vPrefix = q.neg ? 'no ' : '';
  else if(q.tense==='perifrastico') vPrefix = 'ir + a + ';
  else if(q.tense==='gerundio') vPrefix = 'estar + ';
  setVerbDisplay(vPrefix, q.verb.inf, q.verb.tr);

  if(useMC){
    document.getElementById('inputWrap').style.display='none';
    document.getElementById('checkBtn').style.display='none';
    const correct=computeAnswer(q);
    const candidates=buildMCCandidates(q, correct);
    const distractors=new Set();
    while(distractors.size<3 && candidates.length){ const c=candidates.splice(Math.floor(Math.random()*candidates.length),1)[0]; if(c && c.toLowerCase()!==correct.toLowerCase()) distractors.add(c); }
    const options=Array.from(distractors); options.push(correct); options.sort(()=>Math.random()-0.5);
    const mcBox=document.getElementById('mcBox'); mcBox.style.display='flex';
    mcButtons=[];
    options.forEach((opt,i)=>{
      const btn=document.createElement('button'); btn.className='opt-btn'; btn.dataset.opt=opt;
      const num=document.createElement('span'); num.className='opt-num'; num.textContent=(i+1)+'';
      const label=document.createElement('span'); label.textContent=opt;
      btn.appendChild(num); btn.appendChild(label);
      btn.addEventListener('click',()=>selectMC(btn,opt,correct));
      mcBox.appendChild(btn); mcButtons.push(btn);
    });
  } else {
    mcButtons=[];
  }
  if(document.activeElement !== document.getElementById('manualInput')){
    document.getElementById('answer').focus({preventScroll:true});
  }
}
/* distractors must share the same shape as the correct answer (same tense/structure),
   otherwise the odd-one-out (e.g. a 2-word compound form among 1-word forms) gives it away */
function buildMCCandidates(q, correct){
  if(q.tense==='impOtras'){
    const combosList = variedad==='espana' ? IMP_OTRAS_COMBOS.concat([{person:5,neg:false},{person:5,neg:true}]) : IMP_OTRAS_COMBOS;
    return combosList.filter(c=>!(c.person===q.person && c.neg===q.neg))
      .map(c=>computeAnswer({tense:q.tense, verb:q.verb, person:c.person, neg:c.neg}));
  }
  if(q.tense==='impTuAfirm'){
    // only one person exists for this mode; vary the verb's other simple tú-forms instead (still single words, same shape)
    return SIMPLE_SENTENCE_TENSES.map(t=> q.verb.table[t] && q.verb.table[t][1]).filter(Boolean);
  }
  // general case (plain tenses, compound tenses, obligación, perifrástico, tipo gustar):
  // vary the person, keep tense/auxTense fixed, so every option has the same shape as the correct answer
  const out=[];
  const nP = variedad==='espana' ? 6 : 5;
  for(let p=0;p<nP;p++){
    if(p===q.person) continue;
    out.push(computeAnswer({tense:q.tense, auxTense:q.auxTense, verb:q.verb, person:p}));
  }
  return out;
}

function selectMC(btn,opt,correct){
  if(answered) return; answered=true;
  document.querySelectorAll('.opt-btn').forEach(b=>{ if(b.dataset.opt===correct) b.classList.add('correct'); b.disabled=true; });
  if(opt!==correct) btn.classList.add('wrong');
  const fb=document.getElementById('feedback');
  if(opt===correct){ fb.className='feedback ok'; fb.textContent=tr('correcto'); correctCount++; streak++; }
  else { fb.className='feedback bad'; fb.textContent=tr('formaCorrecta')+correct; wrongCount++; streak=0; }
  updateScore();
}
let lastCheckedValue = null;
function checkAnswer(){
  if(!current) return;
  const raw=document.getElementById('answer').value.trim().toLowerCase();
  if(answered){
    if(current.mode!=='multiple' && raw.length>0 && raw!==lastCheckedValue){
      answered=false; // they typed a new attempt — fall through and re-check it
    } else {
      renderQuestion(nextQuestion());
      return;
    }
  }
  if(current.mode==='multiple') return;
  lastCheckedValue = raw;
  const correct=computeAnswer(current);
  const correctLower=correct.toLowerCase();
  let isCorrect = raw===correctLower && raw.length>0;
  let acceptableForms=[correctLower];
  if(current.tense==='impOtras' && current.neg){
    const withoutNo = correctLower.replace(/^no /,'');
    acceptableForms.push(withoutNo);
    if(!isCorrect) isCorrect = raw===withoutNo && raw.length>0;
  }
  if(current.tense==='perifrastico' && current.verb.pronominal){
    const pron = ['me','te','se','nos','se','os'][current.person];
    const irForm = computeAnswer({tense:current.auxTense, verb:IR_OBJ, person:current.person});
    const altForm = (pron+' '+irForm+' a '+current.verb.baseInf).toLowerCase();
    acceptableForms.push(altForm);
    if(!isCorrect) isCorrect = raw===altForm && raw.length>0;
  }
  if(current.tense==='gerundio' && current.verb.pronominal){
    const pron = ['me','te','se','nos','se','os'][current.person];
    const estarForm = computeAnswer({tense:current.auxTense, verb:ESTAR_OBJ, person:current.person});
    const altForm = (pron+' '+estarForm+' '+gerundio(current.verb)).toLowerCase();
    acceptableForms.push(altForm);
    if(!isCorrect) isCorrect = raw===altForm && raw.length>0;
  }
  let isAlmost=false;
  if(!isCorrect && raw.length>0){
    const rawStripped = stripAccents(raw);
    isAlmost = acceptableForms.some(f=>stripAccents(f)===rawStripped);
  }
  const input=document.getElementById('answer'); const fb=document.getElementById('feedback');
  const btn=document.getElementById('checkBtn');
  btn.classList.remove('btn-ok','btn-almost','btn-bad');
  if(isCorrect){
    input.className='correct'; fb.className='feedback ok'; fb.textContent=tr('correcto');
    document.getElementById('tildePop').classList.add('show');
    correctCount++; streak++;
    btn.classList.add('btn-ok');
  } else if(isAlmost){
    input.className='almost'; fb.className='feedback almost';
    fb.textContent=tr('formaCorrecta')+correct+tr('watchAccent');
    wrongCount++; streak=0;
    btn.classList.add('btn-almost');
  } else {
    input.className='wrong'; fb.className='feedback bad'; fb.textContent=tr('formaCorrecta')+correct;
    wrongCount++; streak=0;
    btn.classList.add('btn-bad');
  }
  answered=true; updateScore();
}
function updateScore(){
  document.getElementById('scoreText').textContent = correctCount+' '+tr('correctasLabel')+' · '+wrongCount+' '+tr('incorrectasLabel');
  document.getElementById('streakText').textContent = streak>0 ? '´'.repeat(streak) : '';
}
document.getElementById('checkBtn').addEventListener('click',checkAnswer);
document.getElementById('prevBtn').addEventListener('click',()=>renderQuestion(previousQuestion()));
document.getElementById('nextBtn').addEventListener('click',()=>renderQuestion(nextQuestion()));
document.getElementById('answer').addEventListener('keydown',e=>{ if(e.key==='Enter') checkAnswer(); });
document.getElementById('answer').addEventListener('input',()=>{
  if(answered){
    const input=document.getElementById('answer');
    input.className='';
    document.getElementById('feedback').textContent='';
    document.getElementById('feedback').className='feedback';
    document.getElementById('checkBtn').classList.remove('btn-ok','btn-almost','btn-bad');
  }
});
document.addEventListener('keydown', e=>{
  if(!current || current.mode!=='multiple') return;
  if(!answered){
    const idx = parseInt(e.key,10) - 1;
    if(idx>=0 && idx<mcButtons.length){ e.preventDefault(); mcButtons[idx].click(); }
  } else if(e.key==='Enter'){
    e.preventDefault(); renderQuestion(nextQuestion());
  }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  const active = document.activeElement;
  const isManualField = active && active.id==='manualInput';
  const isAnswerFieldWithText = active && active.id==='answer' && active.value.length>0;
  if(isManualField) return;
  if(e.key==='ArrowRight' && answered){
    e.preventDefault(); renderQuestion(nextQuestion()); return;
  }
  if(isAnswerFieldWithText) return; // don't hijack cursor movement while there's unanswered text to edit
  if(e.key==='ArrowLeft' && !document.getElementById('prevBtn').disabled){
    e.preventDefault(); renderQuestion(previousQuestion());
  } else if(e.key==='ArrowRight'){
    e.preventDefault(); renderQuestion(nextQuestion());
  }
});

renderQuestion(nextQuestion());
updateScore();

  document.documentElement.lang = lang;

  document.getElementById('vEsp').textContent = tr('espLabel');

  document.getElementById('langLabelEs').classList.toggle('active', lang==='es');

  document.getElementById('moodImperativo').textContent = tr('moodImperativo');
  document.getElementById('footerCredit').textContent = tr('createdBy');
  document.getElementById('footerReport').textContent = tr('reportError');

  buildChipGroup('modeChips',['solo','multiple'],v=>({solo:tr('escribirForma'),multiple:tr('opcionMultiple')}[v]),modosActivos);
  buildStructChipGroup('structChips',STRUCT_OPTIONS);
  buildPronominalToggle();
  buildTenseChipGroup('tenseChipsInd',TENSE_GROUPS.ind);
  buildTenseChipGroup('tenseChipsSubj',TENSE_GROUPS.subj);
  buildTenseChipGroup('tenseChipsImp',TENSE_GROUPS.imp);
  renderOnlyManualChip();
  renderOnlyEspecialesChip();
  updateScore();
  if(current){ renderQuestion(current); } else { refresh(); }
}
document.getElementById('langToggle').addEventListener('change', (e)=>{
  lang = e.target.checked ? 'es' : 'en';
  applyLanguage();
});
document.getElementById('langLabelEn').addEventListener('click', ()=>{
  lang = 'en';
  applyLanguage();
});
document.getElementById('langLabelEs').addEventListener('click', ()=>{
  lang = 'es';
  applyLanguage();
});
document.getElementById('howToIcon').addEventListener('click', ()=>{
  howToOpen = !howToOpen;
  document.getElementById('howToPanel').style.display = howToOpen ? 'block' : 'none';
});
applyLanguage();
