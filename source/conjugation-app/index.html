<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spanish Conjugation App | Free Spanish Verb Practice</title>
<meta name="description" content="Free Spanish conjugation app to practice Spanish verbs by tense, mood, level and regional variety. Practice regular and irregular verb conjugations online.">
<link rel="canonical" href="https://tamaramathov.com/conjugation-app/">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta property="og:title" content="Spanish Conjugation App | Free Spanish Verb Practice">
<meta property="og:description" content="Free Spanish conjugation app to practice Spanish verbs by tense, mood, level and regional variety. Practice regular and irregular verb conjugations online.">
<meta property="og:url" content="https://tamaramathov.com/conjugation-app/">
<meta property="og:type" content="website">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#ffffff; --ink:#1a1a1a; --gray:#8a8a8a; --gray-light:#e4e4e4;
  --accent:#c4432e; --ok:#4a7a5c; --warn:#b8860b; --bordeaux:#a3324a; --muted-gold:#b3a58f;
}
*{box-sizing:border-box;}
input[type="radio"]{accent-color:var(--bordeaux);}
html{ overflow-y:scroll; scrollbar-gutter:stable; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh; display:flex; justify-content:center;
  padding:60px 20px 80px;
}
.col{ width:100%; max-width:440px; }

/* header */
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:1rem;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);margin:0;}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 36px;}
.title-with-info{display:flex;align-items:center;gap:8px;}
.info-icon{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--gray);border:1px solid var(--gray-light);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.icon-inline{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--gray);border:1px solid var(--gray-light);border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px;margin:0 1px;}
.info-icon:hover{color:var(--ink);border-color:var(--ink);}
.lang-switch-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.how-to-panel{font-family:'Inter';font-size:.85rem;line-height:1.6;color:var(--ink);background:#fafafa;border:1px solid var(--gray-light);border-radius:2px;padding:20px 22px;margin:0 0 24px;}
.how-to-panel h3{font-family:'IBM Plex Mono',monospace;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);margin:18px 0 8px;}
.how-to-panel h3:first-child{margin-top:0;}
.how-to-panel ul{margin:6px 0;padding-left:20px;}
.how-to-panel li{margin-bottom:6px;}
.how-to-panel p{margin:6px 0;}
.color-ok{color:var(--ok);}
.color-almost{color:var(--warn);}
.color-bad{color:var(--accent);}
.lang-switch-label{font-family:'Inter';font-size:.72rem;font-weight:600;color:var(--gray);cursor:pointer;}
.lang-switch-label.active{color:var(--ink);}
.footer-credit{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--gray);text-align:center;margin:32px 0 0;}
.conjugator-fab{position:fixed;bottom:24px;right:24px;max-width:220px;background:var(--ink);color:var(--bg);font-family:'Inter';font-size:.76rem;font-weight:600;line-height:1.3;padding:12px 18px;border-radius:16px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;z-index:50;transition:transform .12s ease, box-shadow .12s ease;border:none;cursor:pointer;text-align:left;}
.conjugator-fab svg{width:20px;height:20px;flex-shrink:0;}
.conjugator-fab:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.24);}
@media (max-width:480px){.conjugator-fab{bottom:16px;right:16px;max-width:180px;padding:10px 14px;font-size:.7rem;}}
.conjugator-panel{position:fixed;bottom:90px;right:24px;width:340px;max-width:calc(100vw - 32px);max-height:70vh;background:var(--bg);border:1px solid var(--gray-light);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:60;display:flex;flex-direction:column;overflow:hidden;}
.conjugator-panel-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;}
.conjugator-hint{font-family:'Inter';font-size:.72rem;color:var(--gray);margin:8px 14px 12px;padding-bottom:10px;border-bottom:1px solid var(--gray-light);}
.conjugator-search{flex:1;font-family:'Inter';font-size:.9rem;border:1px solid var(--gray-light);border-radius:6px;padding:8px 10px;color:var(--ink);}
.conjugator-search:focus{outline:none;border-color:var(--ink);}
.conjugator-close{cursor:pointer;font-size:1.3rem;color:var(--gray);line-height:1;padding:0 4px;}
.conjugator-close:hover{color:var(--ink);}
.conjugator-suggestions{flex-shrink:0;max-height:78px;overflow-y:auto;border-bottom:1px solid var(--gray-light);scrollbar-width:auto;scrollbar-color:var(--gray) var(--gray-light);}
.conjugator-suggestions:empty{max-height:0;border-bottom:none;}
.conjugator-suggestions::-webkit-scrollbar{width:8px;}
.conjugator-suggestions::-webkit-scrollbar-track{background:var(--gray-light);}
.conjugator-suggestions::-webkit-scrollbar-thumb{background:var(--gray);border-radius:4px;}
.conjugator-suggestion{padding:8px 14px;font-family:'Inter';font-size:.85rem;cursor:pointer;}
.conjugator-suggestion:hover{background:#f4f4f4;}
.conjugator-table{overflow-y:auto;padding:0 16px 18px;font-family:'IBM Plex Mono',monospace;font-size:.74rem;}
.conjugator-verb-title{position:sticky;top:0;z-index:5;background:var(--bg);font-family:'IBM Plex Serif',serif;font-weight:600;font-size:1.15rem;color:var(--ink);margin:0 -16px 12px;padding:12px 16px 10px;border-bottom:1px solid var(--gray-light);box-shadow:0 1px 0 var(--bg);}
.conjugator-verb-tag{font-family:'IBM Plex Mono',monospace;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--bordeaux);font-weight:400;vertical-align:middle;margin-left:4px;}
.conjugator-table h4{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);margin:16px 0 4px;}
.conjugator-table h4.current-tense{color:var(--bordeaux);}
.conjugator-table table.current-tense-table td{background:#fafaf5;}
.conjugator-table h4:first-child{margin-top:0;}
.conjugator-table table{width:100%;border-collapse:collapse;margin-bottom:2px;}
.conjugator-table td{padding:3px 4px;border-bottom:1px solid var(--gray-light);}
.conjugator-table td:first-child{color:var(--gray);width:48%;}
.conjugator-table tr:last-child td{border-bottom:none;}
.conjugator-table tr.extra-row td{color:#c2c2c2;}
.conjugator-table .table-sub{font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);margin:10px 0 2px;}
@media (max-width:480px){.conjugator-panel{right:16px;bottom:80px;width:calc(100vw - 32px);}}
.footer-credit a{color:var(--gray);text-decoration:underline;}
.footer-credit a:hover{color:var(--ink);}

/* filters (collapsed by default) */
.top-divider{ border:none; border-top:1px solid var(--gray-light); margin:0 0 28px; }
.mode-switcher{ display:flex; width:fit-content; border:1px solid var(--gray-light); border-radius:16px; padding:2px; margin:0 auto 40px; }
.mode-switcher-btn{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.66rem; color:var(--gray); background:transparent; border:none; border-radius:13px; padding:5px 12px; cursor:pointer; transition:background .12s ease, color .12s ease; }
.mode-switcher-btn.active{ background:var(--ink); color:var(--bg); }
details.filters{ margin-top:56px; border-top:1px solid var(--gray-light); border-bottom:1px solid var(--gray-light); }
details.filters summary{
  list-style:none; cursor:pointer; padding:12px 0;
  font-family:'IBM Plex Mono',monospace; font-size:.82rem; letter-spacing:.06em; text-transform:uppercase; color:var(--gray);
  display:flex; justify-content:space-between; align-items:center;
}
details.filters > summary::-webkit-details-marker{ display:none; }
details.filters > summary::marker{ content:''; display:none; }
details.filters > summary::after{ content:'+'; font-family:'Inter'; font-size:1rem; }
details.filters[open] > summary::after{ content:'–'; }
.filter-body{ padding:4px 0 24px; }
.f-group{ margin-bottom:20px; }
.f-label{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; letter-spacing:.08em; text-transform:uppercase; color:var(--gray); display:block; margin-bottom:8px; }
.f-sub{ font-family:'Inter'; font-size:.68rem; font-weight:600; color:var(--muted-gold); margin:10px 0 4px; }
.sub-details{ margin:4px 0; }
.sub-details summary.f-sub{ cursor:pointer; list-style:none; list-style-type:none; display:flex; align-items:center; justify-content:flex-start; text-align:left; width:100%; gap:5px; user-select:none; color:var(--muted-gold); }
.sub-details summary.f-sub::-webkit-details-marker{ display:none; }
.sub-details summary.f-sub::marker{ content:''; display:none; font-size:0; }
.sub-details summary.f-sub::before{ content:'▸'; font-size:.6rem; color:#b3a58f; transition:transform .12s ease; }
.sub-details[open] summary.f-sub::before{ transform:rotate(90deg); }
.sub-details .opt-row{ margin-top:4px; }
.opt-row{ display:flex; flex-wrap:wrap; gap:6px; }
.opt{
  font-family:'Inter'; font-size:.78rem; padding:4px 10px; cursor:pointer; user-select:none;
  border:1px solid var(--gray-light); color:var(--gray); border-radius:2px;
}
.opt.active{ border-color:var(--ink); color:var(--ink); }
.select-all-icon{ display:none; margin-left:8px; color:var(--gray); cursor:pointer; font-size:1.35rem; line-height:1; }
.sub-details[open] .select-all-icon{ display:inline; }
.select-all-icon:hover{ color:var(--ink); }
.opt.struct.active{ border-color:var(--muted-gold); color:var(--muted-gold); }
.opt.gold.active{ border-color:var(--muted-gold); color:var(--muted-gold); }
.radio-inline{ display:flex; gap:16px; font-size:.8rem; }
.radio-inline label{ display:flex; align-items:center; gap:5px; cursor:pointer; color:var(--gray); }
.radio-inline input:checked + span{ color:var(--ink); font-weight:600; }
input#manualInput{ width:100%; font-family:'IBM Plex Mono',monospace; font-size:.8rem; padding:8px 0; border:none; border-bottom:1px solid var(--gray-light); outline:none; background:transparent; }
input#manualInput:focus{ border-color:var(--ink); }
.manual-status{ font-family:'IBM Plex Mono',monospace; font-size:.68rem; margin-top:6px; }
.manual-status .ok{ color:var(--ok); } .manual-status .bad{ color:var(--accent); }
.switch-row{ display:flex; align-items:center; gap:8px; }
.switch{ position:relative; width:34px; height:19px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.switch-track{ position:absolute; inset:0; background:var(--gray-light); border-radius:19px; cursor:pointer; transition:background .15s ease; }
.switch-track::before{ content:''; position:absolute; width:14px; height:14px; left:2.5px; top:2.5px; background:#fff; border-radius:50%; transition:transform .15s ease; box-shadow:0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + .switch-track{ background:var(--ink); }
.switch input:checked + .switch-track::before{ transform:translateX(15px); }
.switch-label{ font-family:'Inter'; font-size:.82rem; color:#4a4130; cursor:pointer; }

/* question */
.tags{ display:inline-flex; gap:10px; margin-bottom:30px; flex-wrap:wrap; }
.tag-plate{ display:inline-flex; gap:10px; border-radius:4px; padding:7px 15px; }
.tag-plate:empty{ display:none; }
.tag-plate-tense{ background:rgba(163,50,74,.08); }
.tag-plate-person{ background:rgba(179,165,143,.22); }
.tag-plate-infinitive{ background:var(--gray-light); }
.tag-plate-person .tag.accent{ color:#8a6d3b; }
#questionArea{ }
.flashcard-front .tags{ display:flex; width:fit-content; margin:0 0 16px; font-weight:normal; }
.flashcard-back .tags{ display:flex; width:fit-content; margin:0 0 16px; }
.tag{ font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.05em; text-transform:uppercase; color:var(--gray); }
.tag.accent{ color:var(--bordeaux); }
.tag::before{ content:'· '; color:var(--gray); }
.tag-plate .tag:first-child::before{ content:none; }

.pronoun-line{ font-family:'IBM Plex Serif',serif; font-style:italic; font-size:1.15rem; color:var(--gray); margin-bottom:2px; }
.verb-display{ font-family:'IBM Plex Serif',serif; font-weight:600; font-size:2.6rem; letter-spacing:-.01em; margin:2px 0 28px; }
.verb-display.long{ font-size:1.7rem; line-height:1.3; }
.verb-info-toggle{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:400; color:var(--gray); border:1px solid var(--gray-light); border-radius:10px; padding:2px 8px; display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; margin-left:10px; cursor:pointer; }
.verb-info-pop{ display:block; font-family:'IBM Plex Mono',monospace; font-size:.9rem; font-weight:400; color:var(--ink); background:#fafafa; border:1px solid var(--gray-light); padding:8px 12px; border-radius:2px; margin-top:10px; width:fit-content; }
.extra-form{ color:#c2c2c2; }

#activityStage{ }
.options-row{ display:grid; grid-template-columns:1fr 1fr; gap:2px 20px; margin:-24px 0 24px; }
.opt-btn{
  font-family:'IBM Plex Mono',monospace; font-size:1rem; text-align:left; padding:9px 12px;
  border:none; background:transparent; color:var(--ink); cursor:pointer;
  display:flex; align-items:center; gap:12px; width:100%;
}
.opt-btn:hover{ background:#fafafa; }
.opt-btn.correct{ color:var(--ok); font-weight:600; }
.opt-btn.wrong{ color:var(--accent); text-decoration:line-through; }
.opt-num{ font-size:.72rem; color:var(--gray); border:1px solid var(--gray-light); border-radius:3px; width:18px; height:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.opt-btn.correct .opt-num{ border-color:var(--ok); color:var(--ok); }
.opt-btn.wrong .opt-num{ border-color:var(--accent); color:var(--accent); }

.answer-wrap{ position:relative; margin-bottom:8px; }
.tilde-pop{
  position:absolute; top:-22px; left:0; font-family:'IBM Plex Serif',serif; font-size:1.3rem; color:var(--ok);
  opacity:0; transform:translateY(6px); transition:all .35s ease;
}
.tilde-pop.show{ opacity:1; transform:translateY(0); }
input#answer{
  width:100%; font-family:'IBM Plex Mono',monospace; font-size:1.3rem; padding:8px 0;
  border:none; border-bottom:2px solid var(--ink); outline:none; background:transparent; color:var(--ink);
}
input#answer.wrong{ border-color:var(--accent); color:var(--accent); }
input#answer.correct{ border-color:var(--ok); color:var(--ok); }
input#answer.almost{ border-color:var(--warn); color:var(--warn); }

.actions{ display:flex; justify-content:space-between; align-items:center; margin-top:32px; }
button{ font-family:'Inter'; font-weight:600; font-size:.85rem; border:none; cursor:pointer; background:none; padding:0; }
#checkBtn{ color:var(--bg); background:var(--ink); padding:10px 22px; border-radius:2px; transition:background .12s ease; }
.flashcard-flipper{ perspective:1400px; margin:2px 0 0; padding-bottom:36px; cursor:pointer; }
.flashcard-inner{ position:relative; min-height:140px; transition:transform .5s cubic-bezier(.45,.1,.15,1); transform-style:preserve-3d; }
.flashcard-inner.flipped{ transform:rotateY(180deg); }
.flashcard-front, .flashcard-back{ position:absolute; top:0; left:0; width:100%; height:140px; box-sizing:border-box; padding:16px 20px; border:1px solid var(--gray-light); border-radius:8px; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.flashcard-front{ font-family:'IBM Plex Serif',serif; font-weight:600; font-size:2.6rem; letter-spacing:-.01em; }
.flashcard-back{ transform:rotateY(180deg); }
.flash-answer-correct{ font-family:'IBM Plex Serif',serif; font-weight:600; font-size:2.6rem; letter-spacing:-.01em; color:var(--ok); }
.flash-actions-inline{ gap:10px; }
.flash-again, .flash-gotit{ color:var(--bg); padding:10px 22px; border-radius:2px; border:none; cursor:pointer; font-family:'Inter'; font-size:.95rem; font-weight:600; }
.flash-again{ background:var(--accent); }
.flash-gotit{ background:var(--ok); }
#checkBtn:hover{ background:#333333; }
#checkBtn.btn-ok{ background:var(--ok); }
#checkBtn.btn-almost{ background:var(--warn); }
#checkBtn.btn-bad{ background:var(--accent); }
#nextBtn{ color:var(--gray); }
#nextBtn:hover{ color:var(--ink); }
#prevBtn{ color:var(--gray); }
#prevBtn:hover:not(:disabled){ color:var(--ink); }
#prevBtn:disabled{ opacity:.3; cursor:default; }

.feedback{ font-family:'Inter'; font-size:.85rem; min-height:20px; margin-top:14px; color:var(--gray); }
.feedback.bad{ color:var(--accent); }
.feedback.almost{ color:var(--warn); }
.feedback.ok{ color:var(--ok); }
.warn{ font-family:'Inter'; font-size:.85rem; color:var(--accent); border:1px solid var(--accent); padding:12px 14px; border-radius:2px; }

/* streak as accumulating tildes */
.scoreboard{ margin-top:56px; padding-top:20px; border-top:1px solid var(--gray-light); display:flex; justify-content:space-between; align-items:baseline; }
.score-text{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--gray); }
.streak-marks{ font-family:'IBM Plex Serif',serif; font-size:1.1rem; color:var(--ok); letter-spacing:2px; max-width:200px; text-align:right; overflow-wrap:break-word; }
</style>
</head>
<body>
<div class="col">
  <div class="title-row">
    <div class="title-with-info">
      <h1 class="eyebrow" id="eyebrowTitle">Spanish Conjugation App</h1>
      <span class="info-icon" id="howToIcon">i</span>
    </div>
    <div class="lang-switch-wrap">
      <span class="lang-switch-label active" id="langLabelEn">EN</span>
      <label class="switch">
        <input type="checkbox" id="langToggle">
        <span class="switch-track"></span>
      </label>
      <span class="lang-switch-label" id="langLabelEs">SP</span>
    </div>
  </div>
  <div class="how-to-panel" id="howToPanel" style="display:none;"></div>
  <hr class="top-divider">

  <div class="mode-switcher" id="modeSwitcher"></div>

  <div class="tags" id="tags">
    <span class="tag-plate tag-plate-person" id="tagsPerson"></span>
    <span class="tag-plate tag-plate-tense" id="tagsTense"></span>
  </div>
  <span id="tagsAnchor" style="display:none;"></span>

  <div id="questionArea">
    <div class="pronoun-line" id="pronounLine"></div>
    <div class="verb-display" id="verbDisplay" style="display:none;"></div>
  </div>

  <div id="activityStage">
    <div class="flashcard-flipper" id="flashcardFlipper" style="display:none;">
      <div class="flashcard-inner" id="flashcardInner">
        <div class="flashcard-front" id="flashcardFront"></div>
        <div class="flashcard-back">
          <div class="tags" id="tagsBack">
            <span class="tag-plate tag-plate-infinitive" id="tagInfinitive"></span>
            <span class="tag-plate tag-plate-person" id="tagsPersonBack"></span>
            <span class="tag-plate tag-plate-tense" id="tagsTenseBack"></span>
          </div>
          <div class="flash-answer-correct" id="flashAnswerCorrect"></div>
        </div>
      </div>
    </div>

    <div id="mcBox" class="options-row" style="display:none;"></div>

    <div class="answer-wrap" id="inputWrap">
      <div class="tilde-pop" id="tildePop">´</div>
      <input type="text" id="answer" placeholder="" autocomplete="off">
    </div>
  </div>

  <div class="actions">
    <button id="checkBtn">Check</button>
    <span class="flash-actions-inline" id="flashActions" style="display:none;">
      <button id="flashAgainBtn" class="flash-again">Again</button>
      <button id="flashGotItBtn" class="flash-gotit">Got it</button>
    </span>
    <button id="prevBtn">← Previous</button>
    <button id="nextBtn">Next →</button>
  </div>
  <div class="feedback" id="feedback"></div>
  <div id="warnBox"></div>

  <div class="scoreboard">
    <span class="score-text" id="scoreText">0 correct · 0 incorrect</span>
    <span class="streak-marks" id="streakText"></span>
  </div>

  <details class="filters" id="filtersDetails">
    <summary id="filtrosLabel">Filters</summary>
    <div class="filter-body">
      <div class="f-group">
        <span class="f-label" id="labelManual">Manual mode - Specific verbs</span>
        <input type="text" id="manualInput" placeholder="e.g. hablar, tener, ir">
        <div class="manual-status" id="manualStatus"></div>
        <div class="opt-row" id="onlyManualChip" style="margin-top:8px;"></div>
      </div>
      <div class="f-group">
        <span class="f-label" id="labelVocabulario">Vocabulary</span>
        <div class="radio-inline" id="nivelRadio">
          <label><input type="radio" name="nivel" value="1" checked><span id="nivBasico">basic</span></label>
          <label><input type="radio" name="nivel" value="2"><span id="nivIntermedio">intermediate</span></label>
          <label><input type="radio" name="nivel" value="3"><span id="nivAvanzado">advanced</span></label>
        </div>
      </div>
      <div class="f-group">
        <span class="f-label" id="labelTipo">Verb type</span>
        <div class="opt-row" id="tipoChips"></div>
      </div>
      <div class="f-group">
        <span class="f-label" id="labelTiempos">Verb tenses</span>

const ACCENT = {a:'á',e:'é',i:'í',o:'ó',u:'ú'};
const DEACCENT = {á:'a',é:'e',í:'i',ó:'o',ú:'u'};
function stripAccents(s){ return s.replace(/[áéíóú]/g, c=>DEACCENT[c]); }
function accentLast(s){ const c=s.slice(-1); return s.slice(0,-1) + (ACCENT[c]||c); }
function imperfSubj(verb){ const raw = verb.pronominal ? verb.table.preterito[4].replace(/^(me |te |se |nos )/,'') : verb.table.preterito[4]; const base=raw.slice(0,-3); return [base+'ra',base+'ras',base+'ra',accentLast(base)+'ramos',base+'ran']; }

/* ===== vosotros (España) — derived from existing table data via regular formulas.
   Vosotros is almost never irregular: the only true exceptions are ser->sois and ir->vais
   in the present tense. Everything else (even for irregular verbs like tener, decir, ir)
   follows a predictable pattern from the verb's own forms, which is why we derive it
   instead of hand-writing a whole extra column for 290 verbs. */
function bare(verb, form){
  if(!verb.pronominal) return form;
  return form.replace(/^(me |te |se |nos )/,'');
}
const VOSOTROS_PRES_EXC = {ser:'sois', ir:'vais', dar:'dais', ver:'veis'};
function vosotrosSimple(verb, tense){
  const inf = verb.pronominal ? verb.baseInf : verb.inf;
  if(tense==='presente'){
    let form;
    if(VOSOTROS_PRES_EXC[inf]) form = VOSOTROS_PRES_EXC[inf];
    else { const type=inf.slice(-2), stem=inf.slice(0,-2); form = stem + (type==='ar'?'áis':(type==='er'?'éis':'ís')); }
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='preterito'){
    const tu = bare(verb, verb.table.preterito[1]);
    const suffix = tu.slice(-4); // 'aste' or 'iste' — read from the actual form, not the infinitive class,
    const stem = tu.slice(0,-4); // since irregular preterites (estar, dar, andar...) use -iste even for -ar verbs
    const form = stem + (suffix==='aste' ? 'asteis' : 'isteis');
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='imperfecto'){
    const yo = bare(verb, verb.table.imperfecto[0]);
    const form = yo.slice(0,-1) + 'ais'; // strip last 'a' (aba/ía both end in 'a')
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='futuro'){
    const yo = bare(verb, verb.table.futuro[0]);
    const form = yo.slice(0,-1) + 'éis'; // strip 'é'
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='condicional'){
    const yo = bare(verb, verb.table.condicional[0]);
    const form = yo.slice(0,-2) + 'íais'; // strip 'ía'
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='subjuntivo'){
    const nos = bare(verb, verb.table.subjuntivo[3]); // nosotros — shares whichever irregularity (or lack of it) vosotros needs
    const suffix = nos.slice(-4); // 'emos' or 'amos'
    const stem = nos.slice(0,-4);
    const form = stem + (suffix==='emos' ? 'éis' : 'áis');
    return verb.pronominal ? 'os '+form : form;
  }
  if(tense==='subjImperfecto'){
    const forms = imperfSubj(verb); // already bare
    const form = forms[4].slice(0,-1) + 'is'; // ellos-form 'hablaran' minus 'n' + 'is'
    return verb.pronominal ? 'os '+form : form;
  }
  return null;
}

  return verb.pronominal ? ('os '+auxForm+' '+part) : (auxForm+' '+part);

  pretPerfComp:'presente', pluscuamperfecto:'imperfecto', futuroComp:'futuro',
  condicionalComp:'condicional', subjPretPerfComp:'subjuntivo', subjPluscuamperfecto:'subjImperfecto',

function vosotrosForm(verb, tense){
  if(COMPOUND_AUX_TENSE[tense]) return vosotrosCompound(verb, COMPOUND_AUX_TENSE[tense]);

}

const VOSOTROS_IMP_IRSE = 'idos';
function vosotrosImperativoAfirm(verb){
  const inf = verb.pronominal ? verb.baseInf : verb.inf;
  if(verb.pronominal && inf==='ir') return VOSOTROS_IMP_IRSE;
  const base = inf.slice(0,-1); // drop just the 'r' -> e.g. 'hablad' base 'habla'+'d'
  if(!verb.pronominal) return base + 'd';

  const type = inf.slice(-2);
  const reflexiveBase = type==='ir' ? accentLast(base) : base;
  return reflexiveBase + 'os';
}
function vosotrosImperativoNeg(verb){
  const form = vosotrosSimple(verb, 'subjuntivo');
  return 'no ' + form;
}

function participio(verb){
  const inf = verb.pronominal ? verb.baseInf : verb.inf;
  if(IRREG_PART[inf]) return IRREG_PART[inf];
  const stem = inf.slice(0,-2);
  const type = inf.slice(-2);

}

  const strong='aeo';
  let idx=target.find(i=>strong.includes(word[i]));
  if(idx===undefined) idx=target[target.length-1];
  return word.slice(0,idx)+ACCENT[word[idx]]+word.slice(idx+1);
}
function imperativoAfirmativoReflexivo(v,p){
  if(p===0){
    let base;
    if(TU_IMPERATIVO_IRREGULAR[v.baseInf]) base=TU_IMPERATIVO_IRREGULAR[v.baseInf];
    else { const bare=v.table.presente[1].replace(/^te /,''); base=bare.endsWith('s')?bare.slice(0,-1):bare; }
    return accentPenultimateVowel(base)+'te';
  }
  if(p===1){ const bare=v.table.subjuntivo[2].replace(/^se /,''); return accentPenultimateVowel(bare)+'se'; }
  if(p===2){ const bareFull=v.table.subjuntivo[3].replace(/^nos /,''); const stem=bareFull.slice(0,-3); return accentLast(stem)+'monos'; }
  if(p===3){ const bare=v.table.subjuntivo[4].replace(/^se /,''); return accentPenultimateVowel(bare)+'se'; }
}

/* ===== gerundio (for "estar + gerundio") =====
   Derived mostly from the preterito (él/ella) form we already have verified, since -ir stem-changing
   verbs (pedir->pidiendo, dormir->durmiendo) and y-insertion verbs (leer->leyendo, construir->construyendo)
   already show that exact pattern there. -ar verbs are always regular (-ando) and never use this rule,
   since an -ar preterito can coincidentally end in "ió" (anunció) without that meaning anything for the gerund.
   A handful of verbs are irregular in a way neither rule catches, so they're hand-specified. */
const GERUNDIO_HAND = {ir:'yendo', poder:'pudiendo', decir:'diciendo', traer:'trayendo', venir:'viniendo', reír:'riendo'};
function gerundio(verb){
  const inf = verb.pronominal ? verb.baseInf : verb.inf;
  if(GERUNDIO_HAND[inf]) return GERUNDIO_HAND[inf];
  if(verb.type==='ar'){ return inf.slice(0,-2)+'ando'; }
  const pret2 = verb.pronominal ? verb.table.preterito[2].replace(/^(me |te |se |nos )/,'') : verb.table.preterito[2];
  if(pret2.endsWith('yó')) return pret2.slice(0,-2)+'yendo';
  if(pret2.endsWith('ió')) return pret2.slice(0,-2)+'iendo';
  const stem = inf.slice(0,-2);
  return (stem && 'aeiou'.includes(stem.slice(-1))) ? stem+'yendo' : stem+'iendo';
}
/* attaching a pronoun to the gerundio always needs a written accent on its stressed vowel
   (the one right after and-/iend-/yend-), since the extra syllable pushes it off the default
   stress position — same principle as attaching pronouns to tú-imperatives. */
function accentGerundioForAttach(ger){
  if(ger.endsWith('ando')) return ger.slice(0,-4)+'ándo';
  if(ger.endsWith('iendo')) return ger.slice(0,-5)+'iéndo';
  if(ger.endsWith('yendo')) return ger.slice(0,-5)+'yéndo';
  return ger;
}

const EXAMPLE_VERBS = ['hablar','comer','vivir'];
function exampleForms(tenseId, person, neg){
  return EXAMPLE_VERBS.map(inf=>{
    const v = VERBS.find(vv=>vv.inf===inf);
    const q = {tense:tenseId, verb:v, person};
    if(neg!==undefined) q.neg = neg;
    return computeAnswer(q);
  }).join(' · ');
}
/* builds the tú line(s): if vos would produce the exact same forms (true for every tense
   except presente indicativo and imperativo afirmativo), fold it into one line with just
   "vos" shown in light gray; otherwise vos gets its own full light line underneath. */
function tuVosLines(tuForms, vosForms){
  if(tuForms===vosForms){
    return tuForms+' (tú, <span class="extra-form">vos</span>)';
  }
  return tuForms+' (tú)<br><span class="extra-form">'+vosForms+' (vos)</span>';
}
function vosotrosLine(vosotrosForms){
  return '<span class="extra-form">'+vosotrosForms+' (vosotros)</span>';
}
function tenseExample(tenseId){
  if(tenseId==='impTuAfirm'){
    const tuForms = exampleForms('impTuAfirm', 0);
    const vosForms = EXAMPLE_VERBS.map(inf=>vosImperativoAfirm(VERBS.find(v=>v.inf===inf))).join(' · ');
    return tuVosLines(tuForms, vosForms);
  }
  if(tenseId==='impOtras'){
    const tuNegForms = exampleForms('impOtras', 0, true); // voseo has no distinct negative; always same as tú
    const afirm = [
      exampleForms('impOtras', 1, false)+' (él, ella, usted)',
      exampleForms('impOtras', 2, false)+' (nosotros)',
      vosotrosLine(EXAMPLE_VERBS.map(inf=>vosotrosImperativoAfirm(VERBS.find(v=>v.inf===inf))).join(' · ')),
      exampleForms('impOtras', 3, false)+' (ustedes, ellos, ellas)',
    ];
    const neg = [
      tuVosLines(tuNegForms, tuNegForms),
      exampleForms('impOtras', 1, true)+' (él, ella, usted)',
      exampleForms('impOtras', 2, true)+' (nosotros)',
      vosotrosLine(EXAMPLE_VERBS.map(inf=>vosotrosImperativoNeg(VERBS.find(v=>v.inf===inf))).join(' · ')),
      exampleForms('impOtras', 3, true)+' (ustedes, ellos, ellas)',
    ];
    return '<u>'+tr('afirmativo')+'</u><br>'+afirm.join('<br>')+'<br><br><u>'+tr('negativo')+'</u><br>'+neg.join('<br>');
  }
  const lines = [];
  lines.push(exampleForms(tenseId, 0)+' (yo)');
  const tuForms = exampleForms(tenseId, 1);
  const vosForms = tenseId==='presente'
    ? EXAMPLE_VERBS.map(inf=>vosPresente(VERBS.find(v=>v.inf===inf))).join(' · ')
    : tuForms; // every other tense: vos = tú, no distinct form
  lines.push(tuVosLines(tuForms, vosForms));
  lines.push(exampleForms(tenseId, 2)+' (él, ella, usted)');
  lines.push(exampleForms(tenseId, 3)+' (nosotros)');
  lines.push(vosotrosLine(EXAMPLE_VERBS.map(inf=>vosotrosForm(VERBS.find(v=>v.inf===inf), tenseId)).join(' · ')));
  lines.push(exampleForms(tenseId, 4)+' (ustedes, ellos, ellas)');
  return lines.join('<br>');
}

/* Full reference table for a single arbitrary verb (used by the in-page verb conjugator).
   Reuses the exact same formatting helpers as the example popovers above, just fed one
   verb instead of the fixed hablar/comer/vivir trio. */
function tRow(label, form, extra){
  return '<tr'+(extra?' class="extra-row"':'')+'><td>'+label+'</td><td>'+form+'</td></tr>';
}
function tuVosRows(tuForm, vosForm, extra){
  if(tuForm===vosForm) return tRow('tú / <span class="extra-form">vos</span>', tuForm);
  return tRow('tú', tuForm) + tRow('<span class="extra-form">vos</span>', vosForm, true);
}
function verbFullTable(v){
  const allTenses = [...TENSE_GROUPS.ind, ...TENSE_GROUPS.subj];
  const cat3 = verbCategory3(v);
  const catLabel = cat3==='regular' ? 'regular' : (cat3==='ortho' ? tr('orthoCategoryLabel') : 'irregular');
  let html = '<div class="conjugator-verb-title">'+v.inf+' <span class="conjugator-verb-tag">· '+catLabel+'</span></div>';
  allTenses.forEach(t=>{
    const yo = computeAnswer({tense:t, verb:v, person:0});
    const tuForm = computeAnswer({tense:t, verb:v, person:1});
    const vosForm = t==='presente' ? vosPresente(v) : tuForm;
    const el = computeAnswer({tense:t, verb:v, person:2});
    const nos = computeAnswer({tense:t, verb:v, person:3});
    const vosotrosF = vosotrosForm(v, t);
    const uds = computeAnswer({tense:t, verb:v, person:4});
    let rows = tRow('yo', yo) + tuVosRows(tuForm, vosForm) + tRow('él, ella, usted', el)
             + tRow('nosotros', nos) + tRow('<span class="extra-form">vosotros</span>', vosotrosF, true)
             + tRow('ustedes, ellos, ellas', uds);
    html += '<h4 data-tense="'+t+'">'+TN(t)+'</h4><table>'+rows+'</table>';
  });
  const tuAfirm = computeAnswer({tense:'impTuAfirm', verb:v, person:0});
  const vosAfirm = vosImperativoAfirm(v);
  html += '<h4 data-tense="impTuAfirm">'+TN('impTuAfirm')+'</h4><table>'+tuVosRows(tuAfirm, vosAfirm)+'</table>';
  const afirmRows = tRow('él, ella, usted', computeAnswer({tense:'impOtras', verb:v, person:1, neg:false}))
    + tRow('nosotros', computeAnswer({tense:'impOtras', verb:v, person:2, neg:false}))
    + tRow('<span class="extra-form">vosotros</span>', vosotrosImperativoAfirm(v), true)
    + tRow('ustedes, ellos, ellas', computeAnswer({tense:'impOtras', verb:v, person:3, neg:false}));
  const tuNeg = computeAnswer({tense:'impOtras', verb:v, person:0, neg:true});
  const negRows = tuVosRows(tuNeg, tuNeg)
    + tRow('él, ella, usted', computeAnswer({tense:'impOtras', verb:v, person:1, neg:true}))
    + tRow('nosotros', computeAnswer({tense:'impOtras', verb:v, person:2, neg:true}))
    + tRow('<span class="extra-form">vosotros</span>', vosotrosImperativoNeg(v), true)
    + tRow('ustedes, ellos, ellas', computeAnswer({tense:'impOtras', verb:v, person:3, neg:true}));
  html += '<h4 data-tense="impOtras">'+TN('impOtras')+'</h4>';
  html += '<p class="table-sub">'+tr('afirmativo')+'</p><table>'+afirmRows+'</table>';
  html += '<p class="table-sub">'+tr('negativo')+'</p><table>'+negRows+'</table>';
  return html;
}

        const remainingOutside = Array.from(tensesActivos).filter(v=>!options.includes(v));
        if(remainingOutside.length===0){
          tensesActivos = new Set(['presente']); // nothing would be left selected — fall back to the default
        } else {
          options.forEach(v=>tensesActivos.delete(v));
        }
      } else {
        options.forEach(v=>tensesActivos.add(v));
      }
      buildTenseChipGroup('tenseChipsInd', TENSE_GROUPS.ind);

    lines.push(GUSTAR_OBJ[0]+' gustas (tú &rarr; a mí)');
    lines.push(GUSTAR_OBJ[3]+' gusta (él, ella, usted &rarr; a nosotros)');
    lines.push(GUSTAR_OBJ[2]+' gustamos (nosotros &rarr; a él, ella, usted)');
    lines.push(GUSTAR_OBJ[0]+' gustan (ustedes, ellos, ellas &rarr; a mí)');
    return lines.join('<br>');
  }
  if(id==='gerundio'){
    const ger=(p)=>EXAMPLE_VERBS.map(inf=>{
      const v=VERBS.find(vv=>vv.inf===inf);
      return computeAnswer({tense:'gerundio', auxTense:'presente', verb:v, person:p});
    }).join(' · ');
    const lines=[];
    lines.push(ger(0)+' (yo)');
    const tuForms=ger(1);
    const vosForms=EXAMPLE_VERBS.map(inf=>vosPresente(ESTAR_OBJ)+' '+gerundio(VERBS.find(vv=>vv.inf===inf))).join(' · ');
    lines.push(tuVosLines(tuForms, vosForms));
    lines.push(ger(2)+' (él, ella, usted)');
    lines.push(ger(3)+' (nosotros)');
    const vosotrosForms=EXAMPLE_VERBS.map(inf=>vosotrosForm(ESTAR_OBJ,'presente')+' '+gerundio(VERBS.find(vv=>vv.inf===inf))).join(' · ');
    lines.push(vosotrosLine(vosotrosForms));
    lines.push(ger(4)+' (ustedes, ellos, ellas)');
    return lines.join('<br>');
  }
  return '';
}

function pool(){
  let b=VERBS.filter(v=>v.nivel<=nivelMax && tiposActivos.has(v.tag) && !v.esTipoGustar && (pronominalIncluido || !v.pronominal));
  if(onlyEspeciales && pronominalIncluido){ b = b.filter(v=>v.pronominal); }
  if(manualVerbs.length){
    const manualNonGustar = manualVerbs.filter(v=>!v.esTipoGustar);
    if(onlyManual) return manualNonGustar;
    b = Array.from(new Set([...manualNonGustar, ...b]));
  }
  return b;
}
function gustarPool(){
  let b=VERBS.filter(v=>v.esTipoGustar && v.nivel<=nivelMax && tiposActivos.has(v.tag));
  if(manualVerbs.length){
    const m=manualVerbs.filter(v=>v.esTipoGustar);
    if(onlyManual) return m; // may be empty; caller falls back gracefully
    if(m.length) b = Array.from(new Set([...m, ...b]));
  }
  return b;
}

function activeQuestionTypes(){

}
const AUX_TENSE_POOL_PERIFRASTICO = ['presente','imperfecto']; // "voy a" / "iba a" only

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
/* build every possible verb+tense+person combo for the current filters, shuffled;
   consumed one at a time so nothing repeats until the whole set has been used */
const MANUAL_PRIVILEGE_WEIGHT = 3;
function buildQueue(){
  const types=activeQuestionTypes();
  const combos=[];
  const privileged = (manualVerbs.length && !onlyManual) ? new Set(manualVerbs) : null;
  const activePersonLabels = PERSON_LABELS.filter(l=>personasActivos.has(l));
  types.forEach(qt=>{
    if(qt.kind==='struct'){
      let verbSource = qt.id==='gustarE' ? gustarPool() : pool();
      const auxPool = qt.id==='perifrastico'
        ? AUX_TENSE_POOL_PERIFRASTICO.filter(t=>tensesActivos.has(t))
        : Array.from(tensesActivos).filter(t=>t!=='impTuAfirm' && t!=='impOtras'); // follow "Tiempos verbales" (imperativo doesn't apply here)
      verbSource.forEach(verb=>{
        const copies = (privileged && privileged.has(verb)) ? MANUAL_PRIVILEGE_WEIGHT : 1;
        auxPool.forEach(auxTense=>{
          if(qt.id==='gustarE'){
            activePersonLabels.forEach(objLabel=>{
              activePersonLabels.forEach(subjLabel=>{
                if(subjLabel===objLabel) return; // avoid "me gusto a mí" (exact same identity as both subject and object)
                const person=PERSON_SLOT[objLabel], subjPerson=PERSON_SLOT[subjLabel];
                for(let c=0;c<copies;c++) combos.push({tense:qt.id, auxTense, verb, person, personLabel:objLabel, subjPerson, subjPersonLabel:subjLabel});
              });
            });
          } else {
            activePersonLabels.forEach(label=>{
              const person=PERSON_SLOT[label];
              for(let c=0;c<copies;c++) combos.push({tense:qt.id, auxTense, verb, person, personLabel:label});
            });
          }
        });
      });
    } else if(qt.id==='impTuAfirm'){
      const verbSource = pool();
      const tuVosVariants = [];
      if(personasActivos.has('tu')) tuVosVariants.push('tu');
      if(personasActivos.has('vos')) tuVosVariants.push('vos');
      verbSource.forEach(verb=>{
        const copies = (privileged && privileged.has(verb)) ? MANUAL_PRIVILEGE_WEIGHT : 1;
        tuVosVariants.forEach(variant=>{
          for(let c=0;c<copies;c++) combos.push({tense:qt.id, verb, person:0, personLabel:variant});
        });
      });
    } else if(qt.id==='impOtras'){
      const verbSource = pool();
      const combosList = [];
      if(personasActivos.has('tu') || personasActivos.has('vos')) combosList.push({person:0, neg:true});
      if(personasActivos.has('usted')) combosList.push({person:1, neg:false},{person:1, neg:true});
      if(personasActivos.has('nosotros')) combosList.push({person:2, neg:false},{person:2, neg:true});
      if(personasActivos.has('ustedes')) combosList.push({person:3, neg:false},{person:3, neg:true});
      if(personasActivos.has('vosotros')) combosList.push({person:5, neg:false},{person:5, neg:true});
      verbSource.forEach(verb=>{
        const copies = (privileged && privileged.has(verb)) ? MANUAL_PRIVILEGE_WEIGHT : 1;
        combosList.forEach(combo=>{
          for(let c=0;c<copies;c++) combos.push({tense:qt.id, verb, person:combo.person, neg:combo.neg});
        });
      });
    } else {
      const verbSource = pool();
      verbSource.forEach(verb=>{
        const copies = (privileged && privileged.has(verb)) ? MANUAL_PRIVILEGE_WEIGHT : 1;
        activePersonLabels.forEach(label=>{
          const person=PERSON_SLOT[label];
          for(let c=0;c<copies;c++) combos.push({tense:qt.id, verb, person, personLabel:label});
        });
      });
    }
  });
  return shuffle(combos);
}
function nextQuestion(){
  const modes=Array.from(modosActivos);
  if(modes.length===0){ current=null; return null; }
  if(historyIndex < historyStack.length-1){
    historyIndex++;
    current = historyStack[historyIndex];
    return current;
  }
  if(questionQueue.length===0) questionQueue=buildQueue();
  if(questionQueue.length===0){ current=null; return null; }
  const combo=questionQueue.shift();
  const mode=modes[Math.floor(Math.random()*modes.length)];
  const q={mode, tense:combo.tense, auxTense:combo.auxTense, verb:combo.verb, person:combo.person, neg:combo.neg, subjPerson:combo.subjPerson, personLabel:combo.personLabel, subjPersonLabel:combo.subjPersonLabel};
  historyStack.push(q); historyIndex=historyStack.length-1;
  current=q; return q;
}
function previousQuestion(){
  if(historyIndex<=0) return current; // already at the first question, stay put
  historyIndex--;
  current = historyStack[historyIndex];
  return current;
}
function compoundForm(verb,auxArr,p){ const part=participio(verb); if(verb.pronominal){ const pron=['me ','te ','se ','nos ','se ']; return pron[p]+auxArr[p]+' '+part; } return auxArr[p]+' '+part; }
function computeAnswer(q){
  const v=q.verb,p=q.person,t=q.tense;
  if(p===5){
    const vf = vosotrosForm(v, t);
    if(vf!==null) return vf;
  }
  if(t==='perifrastico'){
    const irForm = computeAnswer({tense:q.auxTense, verb:IR_OBJ, person:p, personLabel:q.personLabel});
    if(v.pronominal){
      const pron = ['me','te','se','nos','se','os'][p];
      return irForm+' a '+v.baseInf+pron; // "voy a quedarme"
    }
    return irForm+' a '+v.inf;
  }
  if(t==='gerundio'){
    const estarForm = computeAnswer({tense:q.auxTense, verb:ESTAR_OBJ, person:p, personLabel:q.personLabel});
    if(v.pronominal){
      const pron = ['me','te','se','nos','se','os'][p];
      return estarForm+' '+accentGerundioForAttach(gerundio(v))+pron; // "estoy quedándome"
    }
    return estarForm+' '+gerundio(v);
  }
  if(t==='gustarE') return GUSTAR_OBJ[p]+' '+computeAnswer({tense:q.auxTense, verb:v, person: q.subjPerson!==undefined ? q.subjPerson : 2, personLabel:q.subjPersonLabel});
  if(t==='impTuAfirm'){
    if(q.personLabel==='vos') return vosImperativoAfirm(v);
    if(v.pronominal) return imperativoAfirmativoReflexivo(v,0);
    return tuImperativo(v);
  }
  if(t==='impOtras'){
    const s=v.table.subjuntivo;
    if(p===5){ // vosotros
      return q.neg ? vosotrosImperativoNeg(v) : vosotrosImperativoAfirm(v);
    }
    if(q.neg){
      const map=[s[1],s[2],s[3],s[4]]; // tú,usted,nosotros,ustedes negative forms
      return 'no '+map[p];
    }
    if(v.pronominal) return imperativoAfirmativoReflexivo(v,p);
    return [null,s[2],s[3],s[4]][p]; // usted/nosotros/ustedes affirmative (tú never affirmative here)
  }
  if(t==='pretPerfComp') return compoundForm(v,HABER.table.presente,p);
  if(t==='pluscuamperfecto') return compoundForm(v,HABER.table.imperfecto,p);
  if(t==='futuroComp') return compoundForm(v,HABER.table.futuro,p);
  if(t==='condicionalComp') return compoundForm(v,HABER.table.condicional,p);
  if(t==='subjPretPerfComp') return compoundForm(v,HABER.table.subjuntivo,p);
  if(t==='subjPluscuamperfecto') return compoundForm(v,imperfSubj(HABER),p);
  if(t==='subjImperfecto'){
    const forms = imperfSubj(v);
    if(v.pronominal){ const pron=['me ','te ','se ','nos ','se ']; return pron[p]+forms[p]; }
    return forms[p];
  }
  if(t==='presente' && p===1 && q.personLabel==='vos') return vosPresente(v);
  return v.table[t][p];
}

    const candidates=buildMCCandidates(q, correct);
    const distractors=new Set();
    while(distractors.size<3 && candidates.length){ const c=candidates.splice(Math.floor(Math.random()*candidates.length),1)[0]; if(c && c.toLowerCase()!==correct.toLowerCase()) distractors.add(c); }
    const options=Array.from(distractors); options.push(correct); options.sort(()=>Math.random()-0.5);
    const mcBox=document.getElementById('mcBox'); mcBox.style.display='grid';
    mcButtons=[];
    options.forEach((opt,i)=>{
      const btn=document.createElement('button'); btn.className='opt-btn'; btn.dataset.opt=opt;
      const num=document.createElement('span'); num.className='opt-num'; num.textContent=(i+1)+'';
      const label=document.createElement('span'); label.textContent=opt;
      btn.appendChild(num); btn.appendChild(label);
      btn.addEventListener('click',()=>selectMC(btn,opt,correct));
      mcBox.appendChild(btn); mcButtons.push(btn);
    });
  } else if(useFlash){
    document.getElementById('inputWrap').style.display='none';
    document.getElementById('checkBtn').style.display='inline-block';
    document.getElementById('checkBtn').textContent = tr('showAnswer');
    mcButtons=[];
  } else {
    mcButtons=[];
  }
  if(!useFlash && document.activeElement !== document.getElementById('manualInput')){
    document.getElementById('answer').focus({preventScroll:true});
  }
}
/* distractors must share the same shape as the correct answer (same tense/structure),
   otherwise the odd-one-out (e.g. a 2-word compound form among 1-word forms) gives it away */
function buildMCCandidates(q, correct){
  if(q.tense==='impOtras'){
    const combosList = [];
    if(personasActivos.has('tu') || personasActivos.has('vos')) combosList.push({person:0, neg:true});
    if(personasActivos.has('usted')) combosList.push({person:1, neg:false},{person:1, neg:true});
    if(personasActivos.has('nosotros')) combosList.push({person:2, neg:false},{person:2, neg:true});
    if(personasActivos.has('ustedes')) combosList.push({person:3, neg:false},{person:3, neg:true});
    if(personasActivos.has('vosotros')) combosList.push({person:5, neg:false},{person:5, neg:true});
    return combosList.filter(c=>!(c.person===q.person && c.neg===q.neg))
      .map(c=>computeAnswer({tense:q.tense, verb:q.verb, person:c.person, neg:c.neg}));
  }
  if(q.tense==='impTuAfirm'){
    // only one person exists for this mode; vary the verb's other simple tú-forms instead (still single words, same shape)
    return SIMPLE_SENTENCE_TENSES.map(t=> q.verb.table[t] && q.verb.table[t][1]).filter(Boolean);
  }
  // general case (plain tenses, compound tenses, obligación, perifrástico, tipo gustar):
  // vary the person, keep tense/auxTense fixed, so every option has the same shape as the correct answer
  const activeLabels = PERSON_LABELS.filter(l=>personasActivos.has(l));
  if(q.tense==='gustarE'){
    // vary both the indirect-object person and the subject (who pleases, drives conjugation),
    // so multiple choice also tests conjugation, not just pronoun-matching
    const pairs=[];
    activeLabels.forEach(objLabel=>{
      activeLabels.forEach(subjLabel=>{
        if(subjLabel===objLabel) return; // avoid "me gusto a mí" (same identity)
        if(objLabel===q.personLabel && subjLabel===q.subjPersonLabel) return; // skip the correct pair
        pairs.push([objLabel,subjLabel]);
      });
    });
    shuffle(pairs);
    const seen = new Set([correct]);
    const out2=[];
    for(const [objLabel,subjLabel] of pairs){
      if(out2.length>=8) break;
      const ans = computeAnswer({tense:q.tense, auxTense:q.auxTense, verb:q.verb, person:PERSON_SLOT[objLabel], personLabel:objLabel, subjPerson:PERSON_SLOT[subjLabel], subjPersonLabel:subjLabel});
      if(seen.has(ans)) continue; // dedupe (e.g. usted/él·ella share a conjugation)
      seen.add(ans); out2.push(ans);
    }
    // fallback: too few active person/subject pairs to fill 3 options (e.g. only "usted"+"él/ella" active) —
    // also vary the underlying tense, first within the user's active tenses, then beyond them if still short.
    if(out2.length<3){
      const tryTenses=(tenseList)=>{
        tenseList.forEach(t=>{
          if(out2.length>=3) return;
          if(t===q.auxTense) return;
          const ans = computeAnswer({tense:q.tense, auxTense:t, verb:q.verb, person:q.person, personLabel:q.personLabel, subjPerson:q.subjPerson, subjPersonLabel:q.subjPersonLabel});
          if(seen.has(ans)) return;
          seen.add(ans); out2.push(ans);
        });
      };
      tryTenses(SIMPLE_SENTENCE_TENSES.filter(t=>tensesActivos.has(t)));
      if(out2.length<3) tryTenses(SIMPLE_SENTENCE_TENSES);
    }
    return out2;
  }
  const out=[];
  const seen = new Set([correct]);
  activeLabels.forEach(label=>{
    if(label===q.personLabel) return;
    const ans = computeAnswer({tense:q.tense, auxTense:q.auxTense, verb:q.verb, person:PERSON_SLOT[label], personLabel:label});
    if(seen.has(ans)) return; // dedupe (e.g. usted/él·ella share a conjugation)
    seen.add(ans); out.push(ans);
  });
  // fallback: if varying person alone didn't yield enough options (e.g. only "usted"+"él/ella" active,
  // which share a conjugation), also vary the tense — first within the user's active tenses, then,
  // if still short, from tenses outside the current filters. This only affects distractor options,
  // never what's actually being asked.
  if(out.length<3 && SIMPLE_SENTENCE_TENSES.includes(q.tense)){
    const tryTenses=(tenseList)=>{
      tenseList.forEach(t=>{
        if(out.length>=3) return;
        if(t===q.tense) return;
        const ans = computeAnswer({tense:t, verb:q.verb, person:q.person, personLabel:q.personLabel});
        if(seen.has(ans)) return;
        seen.add(ans); out.push(ans);
      });
    };
    tryTenses(SIMPLE_SENTENCE_TENSES.filter(t=>tensesActivos.has(t)));
    if(out.length<3) tryTenses(SIMPLE_SENTENCE_TENSES);
  }
  return out;
}

function selectMC(btn,opt,correct){
  if(answered) return; answered=true;
  document.querySelectorAll('.opt-btn').forEach(b=>{ if(b.dataset.opt===correct) b.classList.add('correct'); b.disabled=true; });
  if(opt!==correct) btn.classList.add('wrong');
  const fb=document.getElementById('feedback');
  if(opt===correct){ fb.className='feedback ok'; fb.textContent=tr('correcto'); correctCount++; streak++; }
  else { fb.className='feedback bad'; fb.textContent=tr('formaCorrecta')+correct; wrongCount++; streak=0; }
  updateScore();
}
let lastCheckedValue = null;
function checkAnswer(){
  if(!current) return;
  const raw=document.getElementById('answer').value.trim().toLowerCase();
  if(answered){
    if(current.mode!=='multiple' && raw.length>0 && raw!==lastCheckedValue){
      answered=false; // they typed a new attempt — fall through and re-check it
    } else {
      renderQuestion(nextQuestion());
      return;
    }
  }
  if(current.mode==='multiple') return;
  lastCheckedValue = raw;
  const correct=computeAnswer(current);
  const correctLower=correct.toLowerCase();
  let isCorrect = raw===correctLower && raw.length>0;
  let acceptableForms=[correctLower];
  if(current.tense==='impOtras' && current.neg){
    const withoutNo = correctLower.replace(/^no /,'');
    acceptableForms.push(withoutNo);
    if(!isCorrect) isCorrect = raw===withoutNo && raw.length>0;
  }
  if(current.tense==='perifrastico' && current.verb.pronominal){
    const pron = ['me','te','se','nos','se','os'][current.person];
    const irForm = computeAnswer({tense:current.auxTense, verb:IR_OBJ, person:current.person});
    const altForm = (pron+' '+irForm+' a '+current.verb.baseInf).toLowerCase();
    acceptableForms.push(altForm);
    if(!isCorrect) isCorrect = raw===altForm && raw.length>0;
  }
  if(current.tense==='gerundio' && current.verb.pronominal){
    const pron = ['me','te','se','nos','se','os'][current.person];
    const estarForm = computeAnswer({tense:current.auxTense, verb:ESTAR_OBJ, person:current.person});
    const altForm = (pron+' '+estarForm+' '+gerundio(current.verb)).toLowerCase();
    acceptableForms.push(altForm);
    if(!isCorrect) isCorrect = raw===altForm && raw.length>0;
  }
  let isAlmost=false;
  if(!isCorrect && raw.length>0){
    const rawStripped = stripAccents(raw);
    isAlmost = acceptableForms.some(f=>stripAccents(f)===rawStripped);
  }
  const input=document.getElementById('answer'); const fb=document.getElementById('feedback');
  const btn=document.getElementById('checkBtn');
  btn.classList.remove('btn-ok','btn-almost','btn-bad');
  if(isCorrect){
    input.className='correct'; fb.className='feedback ok'; fb.textContent=tr('correcto');
    document.getElementById('tildePop').classList.add('show');
    correctCount++; streak++;
    btn.classList.add('btn-ok');
  } else if(isAlmost){
    input.className='almost'; fb.className='feedback almost';
    fb.textContent=tr('formaCorrecta')+correct+tr('watchAccent');
    wrongCount++; streak=0;
    btn.classList.add('btn-almost');
  } else {
    input.className='wrong'; fb.className='feedback bad'; fb.textContent=tr('formaCorrecta')+correct;
    wrongCount++; streak=0;
    btn.classList.add('btn-bad');
  }
  answered=true; updateScore();
}
function updateScore(){
  document.getElementById('scoreText').textContent = correctCount+' '+tr('correctasLabel')+' · '+wrongCount+' '+tr('incorrectasLabel');
  document.getElementById('streakText').textContent = streak>0 ? '´'.repeat(streak) : '';
}
function revealFlashcard(){
  if(!current || flashRevealed) return;
  flashRevealed = true;
  document.getElementById('checkBtn').blur();
  const correct = computeAnswer(current);
  document.getElementById('flashAnswerCorrect').textContent = correct;
  document.getElementById('flashcardInner').classList.add('flipped');
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('flashActions').style.display='inline-flex';
}
function hideFlashcard(){
  if(!current || !flashRevealed) return;
  flashRevealed = false;
  document.getElementById('flashcardInner').classList.remove('flipped');
  document.getElementById('checkBtn').style.display='inline-block';
  document.getElementById('checkBtn').textContent = tr('showAnswer');
  document.getElementById('flashActions').style.display='none';
}
document.getElementById('flashcardFlipper').addEventListener('click', ()=>{
  if(flashRevealed){ hideFlashcard(); } else { revealFlashcard(); }
});
document.getElementById('checkBtn').addEventListener('mousedown', e=>{ e.preventDefault(); });
document.getElementById('checkBtn').addEventListener('click',()=>{
  if(current && current.mode==='flashcards'){ revealFlashcard(); }
  else { checkAnswer(); }
});
document.getElementById('flashAgainBtn').addEventListener('click',()=>{
  if(!current) return;
  wrongCount++; streak=0; updateScore();
  questionQueue.push({tense:current.tense, auxTense:current.auxTense, verb:current.verb, person:current.person, neg:current.neg, subjPerson:current.subjPerson, personLabel:current.personLabel, subjPersonLabel:current.subjPersonLabel});
  renderQuestion(nextQuestion());
});
document.getElementById('flashGotItBtn').addEventListener('click',()=>{
  if(!current) return;
  correctCount++; streak++; updateScore();
  renderQuestion(nextQuestion());
});
document.getElementById('prevBtn').addEventListener('click',()=>renderQuestion(previousQuestion()));
document.getElementById('nextBtn').addEventListener('click',()=>renderQuestion(nextQuestion()));
document.getElementById('answer').addEventListener('keydown',e=>{ if(e.key==='Enter') checkAnswer(); });
document.getElementById('answer').addEventListener('input',()=>{
  if(answered){
    const input=document.getElementById('answer');
    input.className='';
    document.getElementById('feedback').textContent='';
    document.getElementById('feedback').className='feedback';
    document.getElementById('checkBtn').classList.remove('btn-ok','btn-almost','btn-bad');
  }
});
document.addEventListener('keydown', e=>{
  if(!current || current.mode!=='multiple') return;
  if(!answered){
    const idx = parseInt(e.key,10) - 1;
    if(idx>=0 && idx<mcButtons.length){ e.preventDefault(); mcButtons[idx].click(); }
  } else if(e.key==='Enter'){
    e.preventDefault(); renderQuestion(nextQuestion());
  }
});
document.addEventListener('keydown', e=>{
  if(!current || current.mode!=='flashcards' || e.key!=='Enter') return;
  e.preventDefault();
  if(flashRevealed){ hideFlashcard(); } else { revealFlashcard(); }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  const active = document.activeElement;
  const isManualField = active && active.id==='manualInput';
  const isAnswerFieldWithText = active && active.id==='answer' && active.value.length>0;
  if(isManualField) return;
  if(e.key==='ArrowRight' && answered){
    e.preventDefault(); renderQuestion(nextQuestion()); return;
  }
  if(isAnswerFieldWithText) return; // don't hijack cursor movement while there's unanswered text to edit
  if(e.key==='ArrowLeft' && !document.getElementById('prevBtn').disabled){
    e.preventDefault(); renderQuestion(previousQuestion());
  } else if(e.key==='ArrowRight'){
    e.preventDefault(); renderQuestion(nextQuestion());
  }
});

renderQuestion(nextQuestion());
updateScore();

function applyLanguage(){
  document.documentElement.lang = lang;
  document.getElementById('howToPanel').innerHTML = HOW_TO_HTML[lang];
  document.getElementById('eyebrowTitle').textContent = tr('title');
  document.getElementById('filtrosLabel').textContent = tr('filtros');
  document.getElementById('labelPersona').textContent = tr('persona');
  document.getElementById('labelVocabulario').textContent = tr('vocabulario');
  document.getElementById('labelTipo').textContent = tr('tipoDeVerbo');
  document.getElementById('labelTiempos').textContent = tr('tiemposVerbales');
  document.getElementById('labelFormas').textContent = tr('formasEspeciales');
  document.getElementById('labelManual').textContent = tr('modoManual');
  document.getElementById('manualInput').placeholder = tr('manualPlaceholder');
  document.getElementById('checkBtn').textContent = tr('check');
  document.getElementById('prevBtn').textContent = tr('prev');
  document.getElementById('nextBtn').textContent = tr('next');
  document.getElementById('nivBasico').textContent = tr('basico');
  document.getElementById('nivIntermedio').textContent = tr('intermedio');
  document.getElementById('nivAvanzado').textContent = tr('avanzado');
  document.getElementById('langToggle').checked = (lang==='es');
  document.getElementById('langLabelEn').classList.toggle('active', lang==='en');
  document.getElementById('langLabelEs').classList.toggle('active', lang==='es');
  document.getElementById('moodIndicativo').textContent = tr('moodIndicativo');
  document.getElementById('moodSubjuntivo').textContent = tr('moodSubjuntivo');
  document.getElementById('moodImperativo').textContent = tr('moodImperativo');
  document.getElementById('footerCredit').textContent = tr('createdBy');
  document.getElementById('footerReport').textContent = tr('reportError');
  document.getElementById('conjugatorFabText').textContent = tr('conjugatorFab');
  document.getElementById('flashAgainBtn').textContent = tr('flashAgain');
  document.getElementById('flashGotItBtn').textContent = tr('flashGotIt');
  document.getElementById('conjugatorHint').textContent = tr('conjugatorHint');

  buildModeSwitcher();
  buildStructChipGroup('structChips',STRUCT_OPTIONS);
  buildPronominalToggle();
  buildTenseChipGroup('tenseChipsInd',TENSE_GROUPS.ind);
  buildTenseChipGroup('tenseChipsSubj',TENSE_GROUPS.subj);
  buildTenseChipGroup('tenseChipsImp',TENSE_GROUPS.imp);
  renderOnlyManualChip();
  renderOnlyEspecialesChip();
  updateScore();
  if(current){ renderQuestion(current); } else { refresh(); }
}
document.getElementById('langToggle').addEventListener('change', (e)=>{
  lang = e.target.checked ? 'es' : 'en';
  applyLanguage();
});
document.getElementById('langLabelEn').addEventListener('click', ()=>{
  lang = 'en';
  applyLanguage();
});
document.getElementById('langLabelEs').addEventListener('click', ()=>{
  lang = 'es';
  applyLanguage();
});
document.getElementById('howToIcon').addEventListener('click', (e)=>{
  e.stopPropagation();
  howToOpen = !howToOpen;
  document.getElementById('howToPanel').style.display = howToOpen ? 'block' : 'none';
});
document.addEventListener('click', (e)=>{
  if(howToOpen){
    const panel = document.getElementById('howToPanel');
    if(!panel.contains(e.target)){
      howToOpen = false;
      panel.style.display = 'none';
    }
  }
  if(openInfoPop && openInfoPop.classList.contains('i-popover') && !openInfoPop.contains(e.target)){
    openInfoPop.style.display = 'none';
    openInfoPop = null;
  }
});

let conjugatorOpen = false;
function renderConjugatorSuggestions(query){
  const box = document.getElementById('conjugatorSuggestions');
  box.innerHTML = '';
  if(!query){ return; }
  const q = query.toLowerCase();
  const matches = VERBS.filter(v=>v.inf.toLowerCase().startsWith(q)).slice(0,8);
  matches.forEach(v=>{
    const item = document.createElement('div');
    item.className = 'conjugator-suggestion';
    item.textContent = v.inf;
    item.addEventListener('click', ()=>selectConjugatorVerb(v));
    box.appendChild(item);
  });
}
function selectConjugatorVerb(v, highlightTense){
  document.getElementById('conjugatorSearch').value = v.inf;
  document.getElementById('conjugatorSuggestions').innerHTML = '';
  const tableEl = document.getElementById('conjugatorTable');
  tableEl.style.display = 'block';
  tableEl.innerHTML = verbFullTable(v);
  if(highlightTense){
    const h4 = tableEl.querySelector('h4[data-tense="'+highlightTense+'"]');
    if(h4){
      h4.classList.add('current-tense');
      const nextTable = h4.nextElementSibling;
      if(nextTable && nextTable.tagName==='TABLE') nextTable.classList.add('current-tense-table');
      h4.scrollIntoView({block:'start'});
    }
  }
}
document.getElementById('conjugatorSearch').addEventListener('input', (e)=>{
  renderConjugatorSuggestions(e.target.value);
  const exact = VERBS.find(v=>v.inf.toLowerCase()===e.target.value.trim().toLowerCase());
  if(exact) selectConjugatorVerb(exact);
});
document.getElementById('conjugatorFab').addEventListener('click', ()=>{
  conjugatorOpen = !conjugatorOpen;
  document.getElementById('conjugatorPanel').style.display = conjugatorOpen ? 'flex' : 'none';
  if(conjugatorOpen){
    const target = (current && current.verb) ? current.verb : VERBS.find(v=>v.inf==='hablar');
    const targetTense = current ? current.tense : null;
    // "special forms" (ir+a, estar+gerundio, gustar) don't have their own section in the reference table
    const highlightable = targetTense && targetTense!=='perifrastico' && targetTense!=='gerundio' && targetTense!=='gustarE';
    selectConjugatorVerb(target, highlightable ? targetTense : null);
    document.getElementById('conjugatorSearch').focus();
  }
});
document.getElementById('conjugatorClose').addEventListener('click', ()=>{
  conjugatorOpen = false;
  document.getElementById('conjugatorPanel').style.display = 'none';
});

applyLanguage();
